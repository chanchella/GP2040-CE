plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kareemabohussien.watertanksizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kareemabohussien.watertanksizer.v7'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '7.0.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

name: Publish verified OAG firmware downloads
on:
  push:
    branches:
      - chatgpt/oag-touch-games-v2-bt-km-fix1-817948d6
    paths:
      - .github/workflows/firmware-downloads.yml
      - downloads/**
      - delivery/publish_release.py
permissions:
  contents: write
jobs:
  publish-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch this delivery commit
        env:
          OAG_REPO: ${{ github.repository }}
          OAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git fetch --quiet --depth=1 "https://github.com/$OAG_REPO.git" "$OAG_SHA"
          git checkout --quiet --detach FETCH_HEAD
      - name: Restore and verify the complete source ZIP
        run: |
          set -euo pipefail
          cat downloads/parts/source.zip.part-* > downloads/OAG_MOBILE_TOUCH_GAMES_V2_BT_KM_FIX1_FULL_SOURCE_AND_UF2.zip
          cd downloads
          sha256sum --check SHA256SUMS.txt
      - name: Publish the two downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 delivery/publish_release.py

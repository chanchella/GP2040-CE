name: OAG Universal Core V1

on:
  push:
    branches:
      - chatgpt/oag-universal-core-v1
    paths:
      - 'oag/**'
      - '.github/workflows/oag-universal-core-v1.yml'
      - '.gitmodules'
      - 'lib/pico_pio_usb'
      - 'lib/tinyusb'
  workflow_dispatch:

jobs:
  ui5j-win-xusb20-iad8-km-composite-2s-policy-and-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify branch ownership and TRUE GOLDEN ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "chatgpt/oag-universal-core-v1"
          TRUE_GOLDEN="59182f30c2028f77c059666d6473487d90a82b64"
          git merge-base --is-ancestor "${TRUE_GOLDEN}" HEAD

      - name: Verify UI2 runtime scope
        shell: bash
        run: |
          set -euo pipefail
          TRUE_GOLDEN="59182f30c2028f77c059666d6473487d90a82b64"

          ACTUAL_RUNTIME="$(git diff --name-only "${TRUE_GOLDEN}" -- \
            oag/firmware/CMakeLists.txt \
            oag/firmware/btstack_config.h \
            oag/firmware/include \
            oag/firmware/src \
            oag/firmware/tusb_config.h \
            oag/include \
            oag/src | sort)"

          EXPECTED_RUNTIME="$(printf '%s\n' \
            'oag/firmware/CMakeLists.txt' \
            'oag/firmware/include/oag/firmware/pc_hid_output.h' \
            'oag/firmware/include/oag/firmware/pc_hid_platform_driver.h' \
            'oag/firmware/include/oag/firmware/pc_native_km_output.h' \
            'oag/firmware/include/oag/firmware/windows_xusb20_compat.h' \
            'oag/firmware/src/main.cpp' \
            'oag/firmware/src/pc_hid_output.cpp' \
            'oag/firmware/src/pc_hid_platform_driver.cpp' \
            'oag/firmware/src/pc_native_km_output.cpp' \
            'oag/firmware/src/pc_xinput_device.cpp' \
            'oag/firmware/src/usb_descriptors.cpp' \
            'oag/firmware/tusb_config.h' \
            'oag/include/oag/device/usb_device_classifier.h' \
            'oag/include/oag/protocol/hid/generic_hid_gamepad_driver.h' \
            'oag/src/device/usb_device_classifier.cpp' \
            'oag/src/output/platform/platform_profile_registry.cpp' \
            'oag/src/protocol/hid/generic_hid_gamepad_driver.cpp' \
            'oag/include/oag/mapping/keyboard_mouse_gamepad_mapper.h' \
            'oag/src/mapping/keyboard_mouse_gamepad_mapper.cpp' \
            'oag/include/oag/mapping/native_km_combo_engine.h' \
            'oag/src/mapping/native_km_combo_engine.cpp' | sort)"

          echo "=== UI5J_WIN_XUSB20_IAD8_KM_COMPOSITE_2S_RUNTIME_DIFF ==="
          printf '%s\n' "${ACTUAL_RUNTIME}"
          test "${ACTUAL_RUNTIME}" = "${EXPECTED_RUNTIME}"

          git diff --exit-code "${TRUE_GOLDEN}" -- \
            oag/firmware/btstack_config.h \
            oag/firmware/include/oag/firmware/bluetooth_host_v2.h \
            oag/firmware/src/bluetooth_host_v2.cpp \
            oag/firmware/src/bluetooth_hid_parser_v2.cpp \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/usb_pio_probe.c \
            oag/firmware/src/xinput_host.cpp \
            oag/src/mapping/digital_binding_engine.cpp \
            oag/src/mapping/logical_slot_manager.cpp \
            oag/src/mapping/mouse_to_stick_mapper.cpp \
            oag/src/mapping/pass_through_mapping.cpp \
            oag/include/oag/mapping/digital_binding_engine.h \
            oag/include/oag/mapping/logical_slot_manager.h \
            oag/include/oag/mapping/mouse_to_stick_mapper.h \
            oag/include/oag/mapping/pass_through_mapping.h \
            oag/src/protocol/xusb \
            oag/src/protocol/xgip \
            oag/src/protocol/hid/boot_keyboard_input_driver.cpp \
            oag/src/protocol/hid/boot_mouse_input_driver.cpp \
            oag/src/feedback

          python3 - <<'PY'
          from pathlib import Path

          main = Path("oag/firmware/src/main.cpp").read_text()
          cmake = Path("oag/firmware/CMakeLists.txt").read_text()
          tusb = Path("oag/firmware/tusb_config.h").read_text()
          desc = Path("oag/firmware/src/usb_descriptors.cpp").read_text()
          xdev = Path("oag/firmware/src/pc_xinput_device.cpp").read_text()
          xplatform = Path("oag/firmware/src/pc_xinput_platform_driver.cpp").read_text()
          core_hid = Path("oag/src/protocol/hid/generic_hid_gamepad_driver.cpp").read_text()
          usb_classifier = Path("oag/src/device/usb_device_classifier.cpp").read_text()
          km = Path("oag/src/mapping/keyboard_mouse_gamepad_mapper.cpp").read_text()
          km_header = Path("oag/include/oag/mapping/keyboard_mouse_gamepad_mapper.h").read_text()
          host = Path("oag/firmware/src/bluetooth_host_v2.cpp").read_text()

          assert "PcXinputPlatformDriver platformOutput_" in main
          assert "PcHidPlatformDriver platformOutput_" not in main
          assert "src/pc_xinput_device.cpp" in cmake
          assert "src/pc_xinput_platform_driver.cpp" in cmake
          assert "src/pc_hid_output.cpp" not in cmake
          assert "src/pc_hid_platform_driver.cpp" not in cmake

          assert "#define CFG_TUD_HID 2" in tusb
          assert "#define CFG_TUD_VENDOR 1" in tusb
          assert "#define CFG_TUD_ENDPOINT0_SIZE 8" in tusb

          assert "AOG Abo Gemi ultra gaming" in desc
          assert "kReceiverVid = 0xCAFE" in desc
          assert "kReceiverPid = 0x4016" in desc
          assert "0x00, 0x00, 0x00" in desc
          assert "0x08, 0x0B, 0x00, 0x08, 0xFF, 0x5D, 0x81, 0x00" in desc
          assert "sizeof(kConfigurationDescriptor) == 0x017B" in desc
          assert "0xFF, 0x5D, 0x81" in desc
          assert "0xFF, 0x5D, 0x82" in desc
          assert "TUD_HID_REPORT_DESC_KEYBOARD" in desc
          assert "TUD_HID_REPORT_DESC_MOUSE" in desc
          assert "0x89" in desc
          assert "0x8A" in desc
          assert "index == 0xEE" in desc
          assert "kMsOsVendorCode = 0x90" in desc
          assert "0x58, 0x55, 0x53, 0x42, 0x32, 0x30" in desc
          assert "sizeof(kExtendedCompatIdDescriptor) == 0x28" in desc
          assert "handleWindowsXusb20CompatIdRequest" in desc

          assert "sendPresence" in xdev
          assert "sendInput" in xdev
          assert "handleWindowsXusb20CompatIdRequest" in xdev
          assert "takeRumble" in xdev
          assert "takePlayerAssignment" in xdev
          assert "return PlatformId::PcXinput360;" in xplatform
          assert ".rumble = true" in xplatform

          assert "GenericHidButtonLayout::ModernCanonical" in core_hid
          assert "GenericHidButtonLayout::SonyPlayStation" in core_hid
          assert "kUsageDpadUp = 0x90" in core_hid
          assert "kUsageConsumerHome = 0x0223" in core_hid
          assert "UsbDeviceProfile::SonyDualSense" in usb_classifier
          assert "UsbDeviceProfile::AogUniversalHid2" in usb_classifier
          assert "UsbDeviceProfile::RazerWolverineV3Pro" in usb_classifier
          assert "UsbDeviceProfile::RazerWolverineV3Tournament" in usb_classifier
          assert "UsbDeviceProfile::EasySmxX15Receiver" in usb_classifier
          assert "UsbDeviceProfile::EasySmxLegacy2f240091" in usb_classifier

          assert "kExtraBindSlots = 6" in km_header
          assert "keyboardUsage(0x1E)" in km
          assert "keyboardUsage(0x21)" in km
          assert "mouseButton(MouseButtonBack)" in km
          assert "mouseButton(MouseButtonForward)" in km
          assert "mouseConfig_.sensitivityX = 1.0" in km
          assert "mouseConfig_.exponent = 0.58" in km
          assert "mouseConfig_.deadzoneX = 0.0" in km
          assert "kMouseAimHoldUs = 10000" in main
          assert "kKeyboardMouseModeHoldUs = 2000000ull" in main
          assert "KeyboardMouseOutputMode::Native" in main
          assert "tud_disconnect();" not in main
          assert "tud_connect();" not in main
          assert "serviceUsbPersonaReenumeration()" not in main
          assert "serviceKeyboardMouseModeToggle()" in main
          assert "serviceNativeKeyboardMouseOutput()" in main
          assert "PcNativeKmOutput nativeKmOutput_" in main
          assert "NativeKmComboEngine nativeKmCombos_" in main

          assert "requestPairingAssist()" in host
          assert "ERROR_CODE_PIN_OR_KEY_MISSING" in host
          assert "kLeLowLatencyIntervalMin = 6u" in host
          assert "kLeLowLatencyIntervalMax = 12u" in host

          print("UI5J_WIN_XUSB20_IAD8_KM_COMPOSITE_2S_POLICY=PASS")
          print("UNIVERSAL_INPUT_UI1_PRESERVED=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware-ui5j-win-xusb20-iad8-km-composite-2s:
    needs: ui5j-win-xusb20-iad8-km-composite-2s-policy-and-tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Pico SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-u9d
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-u9d rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-u9d/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-u9d/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-u9d" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Configure and build Pico 2 W firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-u9d" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Discover outputs and generate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2_FILES[@]}" -eq 1
          test "${#ELF_FILES[@]}" -eq 1
          test "${#MAP_FILES[@]}" -eq 1

          arm-none-eabi-size "${ELF_FILES[0]}" | tee artifacts/size-report.txt

          python3 oag/tools/generate_build_manifest.py \
            build/oag-fw \
            artifacts/build-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/build-manifest.json").read_text())
          f = manifest["features"]

          assert manifest["phase"] == "U10F-PM1-UI5J-WIN-XUSB20-IAD8-KM-COMPOSITE-2S"
          assert f["universal_input_ui1"] is True
          assert f["usb_report_protocol_keyboard"] is True
          assert f["usb_report_protocol_mouse"] is True
          assert f["usb_composite_hid_descriptor_routing"] is True
          assert f["usb_hid_auto_button_layout"] is True
          assert f["xusb_input"] is True
          assert f["wired_xgip_input"] is True
          assert f["generic_hid_gamepad_host"] is True
          assert f["razer_xbox_family_input_profiles"] is True
          assert f["razer_wolverine_v3_pro_1532_0a3f"] is True
          assert f["razer_wolverine_v3_tournament_1532_0a43"] is True
          assert f["easysmx_x15_receiver_1a34_f517"] is True
          assert f["easysmx_legacy_receiver_2f24_0091"] is True
          assert f["easysmx_generic_hid_bluetooth_fallback"] is True
          assert f["km_primary_extra_bind_slots"] == 6
          assert f["km_primary_extra_keyboard_slots"] == 4
          assert f["km_primary_extra_mouse_slots"] == 2
          assert f["km_extra_runtime_reconfigurable_in_mapper"] is True
          assert f["km_mouse_overlay_primary_only"] is True
          assert f["km_global_mode_toggle"] == "F4+F5"
          assert f["km_global_mode_hold_ms"] == 2000
          assert f["km_default_mode"] == "NATIVE_KEYBOARD_MOUSE"
          assert f["km_reserved_chord_never_forwarded"] is True
          assert f["pc_native_keyboard_output"] is True
          assert f["pc_native_mouse_output"] is True
          assert f["pc_native_hid_interfaces"] == 2
          assert f["windows_usb_parent_composite"] is True
          assert f["windows_usb_vid"] == "CAFE"
          assert f["windows_usb_pid"] == "4016"
          assert f["windows_xusb20_compatible_id"] is True
          assert f["windows_xusb20_receiver_interfaces"] == 8
          assert f["windows_xusb20_iad_grouped"] is True
          assert f["windows_xusb20_iad_interface_count"] == 8
          assert f["windows_hid_interfaces"] == 2
          assert f["windows_usb_mode_switch_reenumerates"] is False
          assert f["native_km_combo_engine"] is True
          assert f["native_km_combo_slots"] == 8
          assert f["km_mouse_sensitivity_x"] == 1.0
          assert f["km_mouse_response_exponent"] == 0.58
          assert f["km_mouse_anti_deadzone_x"] == 0.0
          assert f["mouse_aim_recenter_us"] == 10000
          assert f["km_extra_default_keyboard_usages"] == ["1", "2", "3", "4"]

          assert f["pc_generic_hid_output"] is False
          assert f["pc_generic_hid_output_slots"] == 0
          assert f["pc_xinput_output"] is True
          assert f["pc_xinput_output_slots"] == 4
          assert f["multi_xinput_output"] is True
          assert f["slot_scoped_rumble_reverse"] is True
          assert f["rumble_reverse_runtime"] is True

          assert f["bluetooth_host_v2"] is True
          assert f["usb_root_ports"] == 3
          assert f["usb_hub_host"] is True
          assert f["keyboard_boot_host"] is True
          assert f["mouse_boot_host"] is True

          print("BUILD_MANIFEST_UI5J_WIN_XUSB20_IAD8_KM_COMPOSITE_2S=PASS")
          PY

          SHORT_SHA="${GITHUB_SHA::8}"
          cp "${UF2_FILES[0]}" "artifacts/OAG_U10F-PM1-UI5J-WIN-XUSB20-IAD8-KM-COMPOSITE-2S_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF_FILES[0]}" "artifacts/OAG_U10F-PM1-UI5J-WIN-XUSB20-IAD8-KM-COMPOSITE-2S_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP_FILES[0]}" "artifacts/OAG_U10F-PM1-UI5J-WIN-XUSB20-IAD8-KM-COMPOSITE-2S_${SHORT_SHA}_Pico2W.map"
          sha256sum artifacts/OAG_U10F-PM1-UI5J-WIN-XUSB20-IAD8-KM-COMPOSITE-2S_* > artifacts/SHA256SUMS.txt

      - name: Upload UI5J Windows XUSB20 minimal IAD K/M composite candidate bundle
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-U10F-PM1-UI5J-WIN-XUSB20-IAD8-KM-COMPOSITE-2S-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

name: OAG Universal Core V1

on:
  push:
    branches:
      - chatgpt/oag-universal-core-v1
    paths:
      - 'oag/**'
      - 'docs/oag-universal-core-v1/**'
      - '.github/workflows/oag-universal-core-v1.yml'
      - '.gitmodules'
      - 'lib/pico_pio_usb'
      - 'lib/tinyusb'
  workflow_dispatch:

jobs:
  core-policy-and-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify branch ownership
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "chatgpt/oag-universal-core-v1"

      - name: Verify TRUE GOLDEN plus isolated BT-OUT1 BLE peripheral delta
        shell: bash
        run: |
          set -euo pipefail
          U10F_BASELINE="7799d270d98ae09e7608f05b15f687a20a459871"
          U10J_PAIRING="52f727530a2e1d17199ff939b69446745f131c65"
          U10F_PM1_RUNTIME="64195844e28ded0126d3965594705585a31d469d"
          TRUE_GOLDEN="59182f30c2028f77c059666d6473487d90a82b64"

          git merge-base --is-ancestor "${U10F_BASELINE}" HEAD
          git merge-base --is-ancestor "${U10J_PAIRING}" HEAD
          git merge-base --is-ancestor "${U10F_PM1_RUNTIME}" HEAD
          git merge-base --is-ancestor "${TRUE_GOLDEN}" HEAD

          EXPECTED_RUNTIME="$(printf '%s\n' \
            'oag/firmware/include/oag/firmware/bluetooth_host_v2.h' \
            'oag/firmware/src/bluetooth_host_v2.cpp' \
            'oag/firmware/src/main.cpp' | sort)"

          ACTUAL_RUNTIME="$(git diff --name-only "${U10F_BASELINE}" -- \
            oag/firmware/include \
            oag/firmware/src \
            oag/firmware/tusb_config.h \
            oag/include \
            oag/src | sort)"

          test "${ACTUAL_RUNTIME}" = "${EXPECTED_RUNTIME}"

          # BT-OUT1 exact runtime identities.
          test "$(git hash-object oag/firmware/include/oag/firmware/bluetooth_host_v2.h)" = "272dea2861596dd4fc135e192c3e2be49bc08922"
          test "$(git hash-object oag/firmware/src/bluetooth_host_v2.cpp)" = "624ef7dcebe226149be87b40efc2fb654c526f3d"
          test "$(git hash-object oag/firmware/src/main.cpp)" = "7810fa18237b9e5ae9525b6fe8fb9e27fce38925"
          test "$(git hash-object oag/firmware/CMakeLists.txt)" = "df8cd047895715c262b1b0320a4cd86a537e9880"
          test "$(git hash-object oag/firmware/oag_ble_gamepad.gatt)" = "4480925ad1488ec054733b78a856f993e8935f97"

          BT_OUT1_RUNTIME_DIFF="$(git diff --name-only "${TRUE_GOLDEN}" -- \
            oag/firmware/CMakeLists.txt \
            oag/firmware/oag_ble_gamepad.gatt \
            oag/firmware/include \
            oag/firmware/src \
            oag/firmware/tusb_config.h \
            oag/include \
            oag/src | sort)"

          EXPECTED_BT_OUT1_RUNTIME="$(printf '%s\n' \
            'oag/firmware/CMakeLists.txt' \
            'oag/firmware/include/oag/firmware/bluetooth_host_v2.h' \
            'oag/firmware/oag_ble_gamepad.gatt' \
            'oag/firmware/src/bluetooth_host_v2.cpp' \
            'oag/firmware/src/main.cpp' | sort)"

          test "${BT_OUT1_RUNTIME_DIFF}" = "${EXPECTED_BT_OUT1_RUNTIME}"

          # Everything target-facing/USB-facing is exactly U10F.
          git diff --exit-code "${U10F_BASELINE}" -- \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/usb_pio_probe.c \
            oag/firmware/src/xinput_host.cpp \
            oag/firmware/src/usb_descriptors.cpp \
            oag/firmware/src/pc_xinput_device.cpp \
            oag/firmware/src/pc_xinput_platform_driver.cpp \
            oag/firmware/tusb_config.h \
            oag/firmware/src/bluetooth_hid_parser_v2.cpp \
            oag/src/mapping/keyboard_mouse_gamepad_mapper.cpp \
            oag/src/protocol/hid/generic_hid_gamepad_driver.cpp \
            oag/src/protocol/xusb/xusb_input_driver.cpp \
            oag/src/protocol/xgip/xgip_input_driver.cpp

          python3 - <<'PY'
          from pathlib import Path

          main = Path("oag/firmware/src/main.cpp").read_text()
          assert main.count("notifyWiredGamepadDetached(") == 2
          assert "notifyWiredGamepadAttached(" not in main

          bt = Path("oag/firmware/src/bluetooth_host_v2.cpp").read_text()
          assert "requestPairingAssist()" in bt
          assert "ERROR_CODE_PIN_OR_KEY_MISSING" in bt
          assert "kLeLowLatencyIntervalMin = 6u" in bt
          assert "kLeLowLatencyIntervalMax = 12u" in bt
          assert "gap_le_connection_interval(" in bt
          assert "gap_request_connection_parameter_update(" in bt
          assert "HIDS_SUBEVENT_INPUT_REPORT_ENABLE" in bt
          assert "hids_device_send_input_report_for_id(" in bt
          assert "role == HCI_ROLE_SLAVE" in bt
          assert "Do not force SMP immediately from the peripheral side." in bt
          assert "BT-OUT1-P2: platform-side stale-bond repair." in bt
          assert "BT-OUT1-P3: quiesce controller discovery" in bt
          assert "OAGP4 S%u E%02X R%02X" in bt
          assert "sm_event_pairing_complete_get_reason" in bt
          assert "SM_EVENT_PAIRING_STARTED" in bt
          assert "SM_AUTHREQ_SECURE_CONNECTION |" in bt

          main = Path("oag/firmware/src/main.cpp").read_text()
          assert "submitBluetoothPlatformGamepad(" in main

          cmake = Path("oag/firmware/CMakeLists.txt").read_text()
          assert "pico_btstack_make_gatt_header(" in cmake
          assert "U10F-PM1-L1-BT-OUT1" in cmake

          gatt = Path("oag/firmware/oag_ble_gamepad.gatt").read_text()
          assert "ORG_BLUETOOTH_SERVICE_HUMAN_INTERFACE_DEVICE" in gatt
          assert "C4 03" in gatt

          tusb = Path("oag/firmware/tusb_config.h").read_text()
          assert "#define CFG_TUD_HID 0" in tusb

          desc = Path("oag/firmware/src/usb_descriptors.cpp").read_text()
          assert "0x0719" in desc

          platform = Path("oag/firmware/src/pc_xinput_platform_driver.cpp").read_text()
          assert "return PlatformId::PcXinput360;" in platform

          print("U10F_PM1_EXACT_U10F_USB_RUNTIME=PASS")
          print("U10F_PM1_U10J_PAIRING_BASE=PASS")
          print("U10F_PM1_L1_BLE_LATENCY_PRESERVED=PASS")
          print("U10F_PM1_BT_OUT1_ISOLATION=PASS")
          print("U10F_PM1_XBOX360_XINPUT_TARGET=PASS")
          PY

      - name: Verify no Antigravity coupling
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "antigravity/g2e3-work" oag

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2

      - name: Run host tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/oag-host --output-on-failure

  firmware-u10f-pm1:
    needs: core-policy-and-tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Arduino-Pico 6.1.1 SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-u9d
          submodules: recursive
          fetch-depth: 1

      - name: Verify exact U10F-PM1 SDK and Bluetooth dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-u9d rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-u9d/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-u9d/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-u9d" >> "${GITHUB_ENV}"
          echo "U10F_PICO_SDK_230=PASS"
          echo "U10F_BTSTACK_HIDS_HOST=PASS"

      - name: Verify and prepare pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/prepare_dependencies.py

      - name: Configure Pico 2 W U10F-PM1 firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-u9d" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s

      - name: Build Pico 2 W U10F-PM1 firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-fw --parallel 2

      - name: Discover and verify firmware outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "Top-level firmware outputs:"
          find build/oag-fw -maxdepth 1 -type f -printf '%f\n' | sort

          mapfile -t UF2_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2_FILES[@]}" -eq 1
          test "${#ELF_FILES[@]}" -eq 1
          test "${#MAP_FILES[@]}" -eq 1

          echo "OAG_UF2_PATH=${UF2_FILES[0]}" >> "${GITHUB_ENV}"
          echo "OAG_ELF_PATH=${ELF_FILES[0]}" >> "${GITHUB_ENV}"
          echo "OAG_MAP_PATH=${MAP_FILES[0]}" >> "${GITHUB_ENV}"

      - name: Generate size report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          arm-none-eabi-size "${OAG_ELF_PATH}" | tee artifacts/size-report.txt

      - name: Generate and verify build manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/generate_build_manifest.py \
            build/oag-fw \
            artifacts/build-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/build-manifest.json").read_text())
          assert manifest["phase"] == "U10F-PM1-L1-BT-OUT1"
          assert manifest["features"]["usb_hub_host"] is True
          assert manifest["features"]["wired_xgip_input"] is True
          assert manifest["features"]["xgip_host_init_sequence"] is True
          assert manifest["features"]["generic_hid_structural_fallback"] is True
          assert manifest["features"]["known_usb_controller_classifier"] is True
          assert manifest["features"]["usb_host_device_capacity"] == 12
          assert manifest["features"]["usb_host_hub_capacity"] == 4
          assert manifest["features"]["logical_gamepad_slots"] == 8
          assert manifest["features"]["host_enumeration_buffer_bytes"] == 1024
          assert manifest["features"]["pc_generic_hid_output"] is False
          assert manifest["features"]["pc_xinput_output"] is True
          assert manifest["features"]["pc_xinput_output_slots"] == 4
          assert manifest["features"]["multi_xinput_output"] is True
          assert manifest["features"]["slot0_keyboard_mouse_overlay"] is False
          assert manifest["features"]["host_player1_keyboard_mouse_overlay"] is True
          assert manifest["features"]["slot_scoped_rumble_reverse"] is True
          assert manifest["features"]["rumble_reverse_runtime"] is True

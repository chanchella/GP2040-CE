        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"

          cp "${OAG_UF2_PATH}" \
            "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U10J_${SHORT_SHA}_Pico2W.uf2"

          cp "${OAG_ELF_PATH}" \
            "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U10J_${SHORT_SHA}_Pico2W.elf"

          cp "${OAG_MAP_PATH}" \
            "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U10J_${SHORT_SHA}_Pico2W.map"

      - name: Upload U10J firmware bundle
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-Abo-Gemi-Ultra-Gaming-U10J-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

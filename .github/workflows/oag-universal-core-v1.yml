          assert manifest["features"]["u10j_u10f_keyboard_mouse_runtime_frozen"] is True
          assert manifest["features"]["u10j_wired_gamepad_mount_does_not_touch_bt_discovery"] is True
          assert manifest["verification"]["hardware_verified"] is False
          assert manifest["verification"]["hardware_verified_baseline_phase"] == "U9G"
          assert manifest["verification"]["hardware_verified_baseline_sha"] == "3fffa9484f159df6cfbeb807c3acbdf46bdbe52e"
          assert manifest["verification"]["u9f_simultaneous_wired_bluetooth_regression"] == "HARDWARE_VERIFIED"
          assert manifest["verification"]["u9g_xbox_ble_guide_rumble"] == "HARDWARE_VERIFIED"
          assert manifest["verification"]["u10a_single_bluetooth_primary_plus_wired_gamepad_keyboard_mouse"] == "HARDWARE_VERIFIED"
          assert manifest["verification"]["u10a_multibluetooth_2_to_4_peers"] == "PENDING_HARDWARE"
          assert manifest["verification"]["u10b_receiver_descriptor_experiment"] == "REJECTED_RETURNED_TO_U10A"
          assert manifest["verification"]["u10c_primary_selection_chord"] == "HARDWARE_VERIFIED"
          assert manifest["verification"]["u10d_independent_controller_output"] == "REJECTED_HARDWARE"
          assert manifest["verification"]["u10e_true_xbox360_wireless_receiver"] == "PARTIAL_HARDWARE_VERIFIED_PRIMARY_NUMBERING_MISMATCH"

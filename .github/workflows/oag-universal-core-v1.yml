          assert manifest["features"]["golden_usb_host_clock_120mhz"] is True
          assert manifest["features"]["golden_xusb_continuous_rearm"] is True
          assert manifest["features"]["keyboard_boot_host"] is True
          assert manifest["features"]["keyboard_lock_led_output"] is True
          assert manifest["features"]["keyboard_default_numlock_led"] is True
          assert manifest["features"]["g808_skip_set_idle_golden_quirk"] is True
          assert manifest["features"]["mouse_boot_host"] is True
          assert manifest["features"]["generic_hid_gamepad_host"] is True
          assert manifest["features"]["platform_profile_registry"] is True
          assert manifest["features"]["platform_output_runtime_abstraction"] is True
          assert manifest["features"]["keyboard_mouse_runtime_gamepad"] is True
          assert manifest["features"]["bluetooth"] is True
          assert manifest["features"]["bluetooth_host_v2"] is True
          assert manifest["features"]["bluetooth_host_only"] is False
          assert manifest["features"]["bluetooth_peripheral_output"] is True
          assert manifest["features"]["bluetooth_max_simultaneous_peers"] == 4
          assert manifest["features"]["bluetooth_ble_hid_host"] is True
          assert manifest["features"]["bluetooth_classic_hid_host"] is True
          assert manifest["features"]["bluetooth_gamepad_input"] is True
          assert manifest["features"]["bluetooth_keyboard_input"] is True
          assert manifest["features"]["bluetooth_mouse_input"] is True
          assert manifest["features"]["bluetooth_platform_ble_hid_gamepad"] is True
          assert manifest["features"]["bluetooth_platform_primary_mirror"] is True
          assert manifest["features"]["bluetooth_platform_output_connections"] == 1

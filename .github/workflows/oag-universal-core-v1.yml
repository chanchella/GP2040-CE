          assert manifest["features"]["u10d_sequential_endpoint_pairs"] == ["81/01", "82/02", "83/03", "84/04"]
          assert manifest["features"]["u10d_fresh_windows_serial_namespace"] == "OAG-IND"
          assert manifest["features"]["u10d_u10c_runtime_routing_frozen"] is True
          assert manifest["features"]["u10e_receiver_vid"] == "0x045E"
          assert manifest["features"]["u10e_receiver_pid"] == "0x0719"
          assert manifest["features"]["u10e_true_receiver_interfaces"] == 8

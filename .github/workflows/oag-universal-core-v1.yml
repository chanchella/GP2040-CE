name: OAG Universal Core V1

on:
  push:
    branches:
      - chatgpt/oag-universal-core-v1
    paths:
      - 'oag/**'
      - 'docs/oag-universal-core-v1/**'
      - '.github/workflows/oag-universal-core-v1.yml'
      - '.gitmodules'
      - 'lib/pico_pio_usb'
      - 'lib/tinyusb'
  workflow_dispatch:

jobs:
  core-policy-and-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify branch ownership
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "chatgpt/oag-universal-core-v1"

      - name: Verify TRUE GOLDEN plus clean G1 Bluetooth output delta
        shell: bash
        run: |
          set -euo pipefail
          U10F_BASELINE="7799d270d98ae09e7608f05b15f687a20a459871"
          U10J_PAIRING="52f727530a2e1d17199ff939b69446745f131c65"
          U10F_PM1_RUNTIME="64195844e28ded0126d3965594705585a31d469d"
          TRUE_GOLDEN="59182f30c2028f77c059666d6473487d90a82b64"

          git merge-base --is-ancestor "${U10F_BASELINE}" HEAD
          git merge-base --is-ancestor "${U10J_PAIRING}" HEAD
          git merge-base --is-ancestor "${U10F_PM1_RUNTIME}" HEAD
          git merge-base --is-ancestor "${TRUE_GOLDEN}" HEAD

          # The candidate is validated directly against TRUE GOLDEN below.
          # Older U10F ancestry remains asserted above, while USB/XInput
          # target-facing files are byte-diff checked separately.

          # Exact runtime identities for the clean G1 candidate.

          G1_RUNTIME_DIFF="$(git diff --name-only "${TRUE_GOLDEN}" -- \
            oag/firmware/CMakeLists.txt \
            oag/firmware/oag_ble_platform.gatt \
            oag/firmware/include \
            oag/firmware/src \
            oag/firmware/tusb_config.h \
            oag/include \
            oag/src | sort)"

          EXPECTED_G1_RUNTIME="$(printf '%s\n' \
            'oag/firmware/CMakeLists.txt' \
            'oag/firmware/include/oag/firmware/bluetooth_host_v2.h' \
            'oag/firmware/include/oag/firmware/bluetooth_platform_output.h' \
            'oag/firmware/oag_ble_platform.gatt' \
            'oag/firmware/src/bluetooth_host_v2.cpp' \
            'oag/firmware/src/bluetooth_platform_output.cpp' \
            'oag/firmware/src/main.cpp' | sort)"

          echo "=== G1_RUNTIME_DIFF ==="
          printf '%s\n' "${G1_RUNTIME_DIFF}"
          echo "=== EXPECTED_G1_RUNTIME ==="
          printf '%s\n' "${EXPECTED_G1_RUNTIME}"
          test "${G1_RUNTIME_DIFF}" = "${EXPECTED_G1_RUNTIME}"

          # Everything USB/XInput/parser/mapping-facing remains TRUE GOLDEN/U10F.
          echo "=== VERIFY USB/XINPUT TARGET FILES ==="
          git diff --exit-code "${U10F_BASELINE}" -- \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/usb_pio_probe.c \
            oag/firmware/src/xinput_host.cpp \
            oag/firmware/src/usb_descriptors.cpp \
            oag/firmware/src/pc_xinput_device.cpp \
            oag/firmware/src/pc_xinput_platform_driver.cpp \
            oag/firmware/tusb_config.h \
            oag/firmware/src/bluetooth_hid_parser_v2.cpp \
            oag/src/mapping/keyboard_mouse_gamepad_mapper.cpp \
            oag/src/protocol/hid/generic_hid_gamepad_driver.cpp \
            oag/src/protocol/xusb/xusb_input_driver.cpp \
            oag/src/protocol/xgip/xgip_input_driver.cpp

          git diff --exit-code "${TRUE_GOLDEN}" -- \
            oag/firmware/btstack_config.h

          python3 - <<'PY'
          from pathlib import Path

          host = Path("oag/firmware/src/bluetooth_host_v2.cpp").read_text()
          out = Path("oag/firmware/src/bluetooth_platform_output.cpp").read_text()
          main = Path("oag/firmware/src/main.cpp").read_text()
          cmake = Path("oag/firmware/CMakeLists.txt").read_text()
          gatt = Path("oag/firmware/oag_ble_platform.gatt").read_text()

          # TRUE GOLDEN input path and Pairing Assist invariants remain present.
          assert "requestPairingAssist()" in host
          assert "ERROR_CODE_PIN_OR_KEY_MISSING" in host
          assert "kLeLowLatencyIntervalMin = 6u" in host
          assert "kLeLowLatencyIntervalMax = 12u" in host
          assert "gap_request_connection_parameter_update(" in host
          assert "SM_AUTHREQ_BONDING" in host
          assert "SM_AUTHREQ_SECURE_CONNECTION |" not in host
          assert "setPlatformOutputLinkActive" in host

          # New output layer must not re-own/reinitialize the Bluetooth stack.
          assert "hids_device_init(" in out
          assert "battery_service_server_init(100)" in out
          assert "device_information_service_server_init()" in out
          assert "0x02, BLUETOOTH_DATA_TYPE_FLAGS, 0x06" in out
          assert "\n    sm_init();" not in out
          assert "\n    l2cap_init();" not in out
          assert "\n    cyw43_arch_init(" not in out
          assert "\n    hci_power_control(" not in out
          assert "sm_set_authentication_requirements(" not in out

          assert "bluetoothPlatformOutput_.initialize(" in main
          assert "bluetoothPlatformOutput_.submit(" in main

          assert "src/bluetooth_platform_output.cpp" in cmake
          assert "pico_btstack_make_gatt_header(" in cmake
          assert "oag_ble_platform.gatt" in cmake

          assert '#import <hids.gatt>' in gatt
          assert '#import <battery_service.gatt>' in gatt
          assert '#import <device_information_service.gatt>' in gatt
          assert "C4 03" in gatt

          tusb = Path("oag/firmware/tusb_config.h").read_text()
          assert "#define CFG_TUD_HID 0" in tusb

          desc = Path("oag/firmware/src/usb_descriptors.cpp").read_text()
          assert "0x0719" in desc

          platform = Path("oag/firmware/src/pc_xinput_platform_driver.cpp").read_text()
          assert "return PlatformId::PcXinput360;" in platform

          print("TRUE_GOLDEN_59182F30_BASE=PASS")
          print("USB_XINPUT_KM_PATHS_UNCHANGED=PASS")
          print("BLUETOOTH_INPUT_PATH_PRESERVED=PASS")
          print("G1_EXTERNAL_BLE_OUTPUT_ISOLATED=PASS")
          PY

      - name: Verify no Antigravity coupling
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "antigravity/g2e3-work" oag

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2

      - name: Run host tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/oag-host --output-on-failure

  firmware-u10f-pm1:
    needs: core-policy-and-tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Arduino-Pico 6.1.1 SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-u9d
          submodules: recursive
          fetch-depth: 1

      - name: Verify exact U10F-PM1 SDK and Bluetooth dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-u9d rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-u9d/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-u9d/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-u9d" >> "${GITHUB_ENV}"
          echo "U10F_PICO_SDK_230=PASS"
          echo "U10F_BTSTACK_HIDS_HOST=PASS"

      - name: Verify and prepare pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/prepare_dependencies.py

      - name: Configure Pico 2 W U10F-PM1 firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-u9d" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s

      - name: Build Pico 2 W U10F-PM1 firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-fw --parallel 2

      - name: Discover and verify firmware outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "Top-level firmware outputs:"
          find build/oag-fw -maxdepth 1 -type f -printf '%f\n' | sort

          mapfile -t UF2_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2_FILES[@]}" -eq 1
          test "${#ELF_FILES[@]}" -eq 1
          test "${#MAP_FILES[@]}" -eq 1

          echo "OAG_UF2_PATH=${UF2_FILES[0]}" >> "${GITHUB_ENV}"
          echo "OAG_ELF_PATH=${ELF_FILES[0]}" >> "${GITHUB_ENV}"
          echo "OAG_MAP_PATH=${MAP_FILES[0]}" >> "${GITHUB_ENV}"

      - name: Generate size report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          arm-none-eabi-size "${OAG_ELF_PATH}" | tee artifacts/size-report.txt

      - name: Generate and verify build manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/generate_build_manifest.py \
            build/oag-fw \
            artifacts/build-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/build-manifest.json").read_text())
          assert manifest["phase"] == "U10F-PM1-G1-BT-OUT"
          f = manifest["features"]

          # TRUE GOLDEN hardware/runtime invariants.
          assert f["usb_root_ports"] == 3
          assert f["usb_hub_host"] is True
          assert f["pc_xinput_output"] is True
          assert f["pc_xinput_output_slots"] == 4
          assert f["golden_usb_host_clock_120mhz"] is True
          assert f["golden_xusb_continuous_rearm"] is True
          assert f["keyboard_boot_host"] is True
          assert f["mouse_boot_host"] is True
          assert f["generic_hid_gamepad_host"] is True

          # Golden Bluetooth input stays enabled while G1 adds one generic
          # peripheral/output persona.
          assert f["bluetooth_host_v2"] is True
          assert f["bluetooth_host_only"] is False
          assert f["bluetooth_peripheral_output"] is True
          assert f["bluetooth_peripheral_profile"] == "GENERIC_BLE_HID_GAMEPAD"
          assert f["bluetooth_peripheral_primary_only"] is True
          assert f["bluetooth_peripheral_sm_policy"] == "TRUE_GOLDEN_BONDING_NO_IO"
          assert f["bluetooth_ble_hid_host"] is True
          assert f["bluetooth_classic_hid_host"] is True

          print("BUILD_MANIFEST_G1=PASS")
          PY

      - name: Package exact-SHA artifacts
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"

          cp "${OAG_UF2_PATH}" \
            "artifacts/OAG_U10F_PM1_G1_BT_OUT_${SHORT_SHA}_Pico2W.uf2"

          cp "${OAG_ELF_PATH}" \
            "artifacts/OAG_U10F_PM1_G1_BT_OUT_${SHORT_SHA}_Pico2W.elf"

          cp "${OAG_MAP_PATH}" \
            "artifacts/OAG_U10F_PM1_G1_BT_OUT_${SHORT_SHA}_Pico2W.map"

      - name: Package full G1 Bluetooth output project
        shell: bash
        run: |
          set -euo pipefail

          STOCK_SOURCE_SHA="0f91033fdde41323c5e5e607236a7b843fdfba33"
          STOCK_SHORT="${STOCK_SOURCE_SHA::8}"
          STOCK_NAME="OAG_U10F_PM1_G1_BT_OUT_FULL_PROJECT_${STOCK_SHORT}"
          STOCK_PARENT="${GITHUB_WORKSPACE}/stock"
          STOCK_ROOT="${STOCK_PARENT}/${STOCK_NAME}"

          rm -rf "${STOCK_PARENT}"
          mkdir -p "${STOCK_ROOT}"

          # Exact U10F-PM1 source tree, not the CI packaging-only commit.
          git archive "${STOCK_SOURCE_SHA}" | tar -x -C "${STOCK_ROOT}"

          # Materialize the two pinned repository submodules into the stock tree.
          rm -rf             "${STOCK_ROOT}/lib/tinyusb"             "${STOCK_ROOT}/lib/pico_pio_usb"

          mkdir -p             "${STOCK_ROOT}/lib/tinyusb"             "${STOCK_ROOT}/lib/pico_pio_usb"

          rsync -a --exclude='.git'             "${GITHUB_WORKSPACE}/lib/tinyusb/"             "${STOCK_ROOT}/lib/tinyusb/"

          rsync -a --exclude='.git'             "${GITHUB_WORKSPACE}/lib/pico_pio_usb/"             "${STOCK_ROOT}/lib/pico_pio_usb/"

          # Include the exact Pico SDK + BTstack + CYW43 generation used by CI
          # so this stock package is self-contained for the pinned toolchain
          # source dependencies.
          mkdir -p "${STOCK_ROOT}/dependencies/pico-sdk-2.3.0"
          rsync -a --exclude='.git'             "${GITHUB_WORKSPACE}/pico-sdk-u9d/"             "${STOCK_ROOT}/dependencies/pico-sdk-2.3.0/"

          mkdir -p "${STOCK_ROOT}/BUILD_ARTIFACTS"
          cp artifacts/OAG_U10F_PM1_G1_BT_OUT_*_Pico2W.uf2             "${STOCK_ROOT}/BUILD_ARTIFACTS/"
          cp artifacts/OAG_U10F_PM1_G1_BT_OUT_*_Pico2W.elf             "${STOCK_ROOT}/BUILD_ARTIFACTS/"
          cp artifacts/OAG_U10F_PM1_G1_BT_OUT_*_Pico2W.map             "${STOCK_ROOT}/BUILD_ARTIFACTS/"
          cp artifacts/build-manifest.json             "${STOCK_ROOT}/BUILD_ARTIFACTS/"
          cp artifacts/size-report.txt             "${STOCK_ROOT}/BUILD_ARTIFACTS/"

          PIO_SHA="$(git -C lib/pico_pio_usb rev-parse HEAD)"
          TINYUSB_SHA="$(git -C lib/tinyusb rev-parse HEAD)"
          PICO_SDK_SHA="$(git -C pico-sdk-u9d rev-parse HEAD)"
          BTSTACK_SHA="$(git -C pico-sdk-u9d/lib/btstack rev-parse HEAD)"
          CYW43_SHA="$(git -C pico-sdk-u9d/lib/cyw43-driver rev-parse HEAD)"

          cat > "${STOCK_ROOT}/STOCK_INFO.txt" <<EOF
          OAG U10F-PM1-G1-BT-OUT FULL PROJECT
          ======================================
          Runtime/source commit: ${STOCK_SOURCE_SHA}
          Packaging workflow commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}

          Runtime basis:
          - TRUE GOLDEN parent: 59182f30c2028f77c059666d6473487d90a82b64.
          - Existing USB / Hub / XInput / Receiver / Keyboard / Mouse runtime preserved.
          - TRUE GOLDEN Bluetooth Host, Pairing Mode, and BLE low-latency input preserved.
          - External output rebuilt from scratch as an isolated Generic BLE HID Gamepad.
          - Output uses TRUE GOLDEN SM policy: Bonding + NoInputNoOutput; no forced Secure Connections.
          - Official BTstack HOG services: HID + Battery + Device Information.
          - PC USB target remains Xbox 360 / XInput receiver in parallel.

          Pinned dependencies:
          Pico-PIO-USB: ${PIO_SHA}
          TinyUSB: ${TINYUSB_SHA}
          Pico SDK: ${PICO_SDK_SHA}
          BTstack: ${BTSTACK_SHA}
          CYW43: ${CYW43_SHA}

          Included:
          - Full repository source tree at the runtime commit
          - Full TinyUSB submodule source
          - Full Pico-PIO-USB submodule source
          - Exact Pico SDK source used by CI, including its checked-out dependencies
          - UF2 / ELF / MAP
          - build-manifest.json
          - size-report.txt
          - SHA256SUMS.txt
          EOF

          (
            cd "${STOCK_ROOT}"
            find . -type f ! -name SHA256SUMS.txt -print0               | sort -z               | xargs -0 sha256sum > SHA256SUMS.txt
          )

          (
            cd "${STOCK_PARENT}"
            zip -r -6               "${GITHUB_WORKSPACE}/artifacts/${STOCK_NAME}.zip"               "${STOCK_NAME}"
          )

          sha256sum             "artifacts/${STOCK_NAME}.zip"             | tee "artifacts/${STOCK_NAME}.zip.sha256.txt"

          echo "G1_BT_OUT_FULL_PROJECT_PACKAGE=PASS"

      - name: Upload G1 Bluetooth output bundle
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-U10F-PM1-G1-BT-OUT-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

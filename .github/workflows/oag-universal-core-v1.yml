name: OAG Universal Core V1

on:
  push:
    branches:
      - chatgpt/oag-universal-core-v1
    paths:
      - 'oag/**'
      - 'docs/oag-universal-core-v1/**'
      - '.github/workflows/oag-universal-core-v1.yml'
      - '.gitmodules'
      - 'lib/pico_pio_usb'
      - 'lib/tinyusb'
  workflow_dispatch:

jobs:
  core-policy-and-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify branch ownership
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "chatgpt/oag-universal-core-v1"

      - name: Verify U10J USB-safe pairing scope against U10I and U10F
        shell: bash
        run: |
          set -euo pipefail
          U10I_BASELINE="5a840a789f7d91808e34ba8c137947c4527c0996"
          U10F_BASELINE="7799d270d98ae09e7608f05b15f687a20a459871"

          git merge-base --is-ancestor "${U10I_BASELINE}" HEAD
          git merge-base --is-ancestor "${U10F_BASELINE}" HEAD

          EXPECTED="$(printf '%s\n' \
            'oag/firmware/include/oag/firmware/bluetooth_host_v2.h' \
            'oag/firmware/src/bluetooth_host_v2.cpp' \
            'oag/firmware/src/main.cpp' | sort)"

          ACTUAL="$(git diff --name-only "${U10F_BASELINE}" -- \
            oag/firmware/include \
            oag/firmware/src \
            oag/firmware/tusb_config.h \
            oag/include \
            oag/src | sort)"

          test "${ACTUAL}" = "${EXPECTED}"

          git diff --exit-code "${U10F_BASELINE}" -- \
            oag/firmware/src/usb_host.cpp \
            oag/firmware/include/oag/firmware/usb_host.h \
            oag/firmware/src/usb_descriptors.cpp \
            oag/firmware/tusb_config.h \
            oag/firmware/src/bluetooth_hid_parser_v2.cpp \
            oag/firmware/include/oag/firmware/pc_xinput_device.h \
            oag/firmware/src/pc_xinput_device.cpp \
            oag/firmware/include/oag/firmware/pc_xinput_platform_driver.h \
            oag/firmware/src/pc_xinput_platform_driver.cpp \
            oag/include/oag/input/gamepad_state.h

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          baseline = subprocess.check_output(
              ["git", "show", "7799d270d98ae09e7608f05b15f687a20a459871:oag/firmware/src/main.cpp"],
              text=True,
          )
          current = Path("oag/firmware/src/main.cpp").read_text()

          hook = """        bluetoothHost_.notifyWiredGamepadDetached(
              record->vid,
              record->pid
          );

          """

          if current.count(hook) != 2:
              raise SystemExit("expected exactly two detach-only pairing hooks")

          if current.replace(hook, "") != baseline:
              raise SystemExit("main.cpp changed beyond detach-only pairing hooks")

          print("U10J_MAIN_U10F_PLUS_DETACH_ONLY=PASS")
          PY

          echo "U10J_U10F_USB_RECEIVER_KM_FREEZE=PASS"
          echo "U10J_PAIRING_ASSIST_USB_ISOLATION=PASS"

      - name: Verify no Antigravity coupling
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "antigravity/g2e3-work" oag

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2

      - name: Run host tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/oag-host --output-on-failure

  firmware-u10j:
    needs: core-policy-and-tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Arduino-Pico 6.1.1 SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-u9d
          submodules: recursive
          fetch-depth: 1

      - name: Verify exact U10J SDK and Bluetooth dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-u9d rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-u9d/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-u9d/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-u9d" >> "${GITHUB_ENV}"
          echo "U10J_PICO_SDK_230=PASS"
          echo "U10J_BTSTACK_HIDS_HOST=PASS"

      - name: Verify and prepare pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/prepare_dependencies.py

      - name: Configure Pico 2 W U10J firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-u9d" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s

      - name: Build Pico 2 W U10J firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-fw --parallel 2

      - name: Discover and verify firmware outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "Top-level firmware outputs:"
          find build/oag-fw -maxdepth 1 -type f -printf '%f\n' | sort

          mapfile -t UF2_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2_FILES[@]}" -eq 1
          test "${#ELF_FILES[@]}" -eq 1
          test "${#MAP_FILES[@]}" -eq 1

          echo "OAG_UF2_PATH=${UF2_FILES[0]}" >> "${GITHUB_ENV}"
          echo "OAG_ELF_PATH=${ELF_FILES[0]}" >> "${GITHUB_ENV}"
          echo "OAG_MAP_PATH=${MAP_FILES[0]}" >> "${GITHUB_ENV}"

      - name: Generate size report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          arm-none-eabi-size "${OAG_ELF_PATH}" | tee artifacts/size-report.txt

      - name: Generate and verify build manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/generate_build_manifest.py \
            build/oag-fw \
            artifacts/build-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/build-manifest.json").read_text())
          assert manifest["phase"] == "U10J"
          assert manifest["features"]["usb_hub_host"] is True
          assert manifest["features"]["wired_xgip_input"] is True
          assert manifest["features"]["xgip_host_init_sequence"] is True
          assert manifest["features"]["generic_hid_structural_fallback"] is True
          assert manifest["features"]["known_usb_controller_classifier"] is True
          assert manifest["features"]["usb_host_device_capacity"] == 12
          assert manifest["features"]["usb_host_hub_capacity"] == 4
          assert manifest["features"]["logical_gamepad_slots"] == 8
          assert manifest["features"]["host_enumeration_buffer_bytes"] == 1024
          assert manifest["features"]["pc_generic_hid_output"] is False
          assert manifest["features"]["pc_xinput_output"] is True
          assert manifest["features"]["pc_xinput_output_slots"] == 4
          assert manifest["features"]["multi_xinput_output"] is True
          assert manifest["features"]["slot0_keyboard_mouse_overlay"] is False
          assert manifest["features"]["host_player1_keyboard_mouse_overlay"] is True
          assert manifest["features"]["slot_scoped_rumble_reverse"] is True
          assert manifest["features"]["rumble_reverse_runtime"] is True
          assert manifest["features"]["host_root_watchdog_2s"] is False
          assert manifest["features"]["golden_usb_host_clock_120mhz"] is True
          assert manifest["features"]["golden_xusb_continuous_rearm"] is True
          assert manifest["features"]["keyboard_boot_host"] is True
          assert manifest["features"]["keyboard_lock_led_output"] is True
          assert manifest["features"]["keyboard_default_numlock_led"] is True
          assert manifest["features"]["g808_skip_set_idle_golden_quirk"] is True
          assert manifest["features"]["mouse_boot_host"] is True
          assert manifest["features"]["generic_hid_gamepad_host"] is True
          assert manifest["features"]["platform_profile_registry"] is True
          assert manifest["features"]["platform_output_runtime_abstraction"] is True
          assert manifest["features"]["keyboard_mouse_runtime_gamepad"] is True
          assert manifest["features"]["bluetooth"] is True
          assert manifest["features"]["bluetooth_host_v2"] is True
          assert manifest["features"]["bluetooth_host_only"] is True
          assert manifest["features"]["bluetooth_peripheral_output"] is False
          assert manifest["features"]["bluetooth_max_simultaneous_peers"] == 4
          assert manifest["features"]["bluetooth_ble_hid_host"] is True

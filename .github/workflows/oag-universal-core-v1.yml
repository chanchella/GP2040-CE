          assert manifest["verification"]["hardware_verified"] is False
          assert manifest["verification"]["hardware_verified_baseline_phase"] == "U10F-PM1-L1 TRUE GOLDEN"
          assert manifest["verification"]["hardware_verified_baseline_sha"] == "59182f30c2028f77c059666d6473487d90a82b64"
          assert manifest["verification"]["bt_out1_ble_platform_output"] == "PENDING_HARDWARE"

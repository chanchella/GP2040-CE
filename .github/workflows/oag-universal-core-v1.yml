          assert manifest["features"]["u10c_u10a_pc_output_descriptor_restored"] is True
          assert manifest["features"]["u10c_primary_select_hold_ms"] == 3000
          assert manifest["features"]["u10c_primary_select_start_share_back_fallback"] is True
          assert manifest["features"]["u10c_xbox_ble_consumer_record_share"] is True
          assert manifest["features"]["u10c_keyboard_mouse_follow_primary"] is True
          assert manifest["features"]["u10c_usb_hub_gamepads_not_port_bound"] is True

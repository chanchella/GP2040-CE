name: OAG Universal Core V1

on:
  push:
    branches:
      - chatgpt/oag-universal-core-v1
      - chatgpt/ui5k-bt-out13-standalone-owner
    paths:
      - 'oag/**'
      - '.github/workflows/oag-universal-core-v1.yml'
      - '.gitmodules'
      - 'lib/pico_pio_usb'
      - 'lib/tinyusb'
  workflow_dispatch:

jobs:
  ui5k-win-xusb20-4func-km-composite-2s-policy-and-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify branch ownership and TRUE GOLDEN ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "chatgpt/ui5k-bt-out13-standalone-owner"
          UI5K_BASE="01af260742a6a402a851cceef0707ae69bd6a301"
          git merge-base --is-ancestor "${UI5K_BASE}" HEAD

      - name: Verify UI5K-BT-OUT13-STANDALONE-OWNER minimal runtime delta
        shell: bash
        run: |
          set -euo pipefail
          UI5K_BASE="01af260742a6a402a851cceef0707ae69bd6a301"

          ACTUAL_RUNTIME="$(git diff --name-only "${UI5K_BASE}" -- \
            oag/firmware/CMakeLists.txt \
            oag/firmware/btstack_config.h \
            oag/firmware/oag_ble_platform.gatt \
            oag/firmware/include \
            oag/firmware/src \
            oag/firmware/tusb_config.h \
            oag/include \
            oag/src | sort)"

          EXPECTED_RUNTIME="$(printf '%s\n' \
            'oag/firmware/CMakeLists.txt' \
            'oag/firmware/btstack_config.h' \
            'oag/firmware/include/oag/firmware/bluetooth_host_v2.h' \
            'oag/firmware/include/oag/firmware/bluetooth_platform_output.h' \
            'oag/firmware/oag_ble_platform.gatt' \
            'oag/firmware/src/bluetooth_host_v2.cpp' \
            'oag/firmware/src/bluetooth_platform_output.cpp' \
            'oag/firmware/src/main.cpp' | sort)"

          echo "=== UI5K_BT_OUT13_STANDALONE_OWNER_RUNTIME_DIFF ==="
          printf '%s\n' "${ACTUAL_RUNTIME}"
          test "${ACTUAL_RUNTIME}" = "${EXPECTED_RUNTIME}"

          # UI5K protected paths: Bluetooth Output must not rewrite USB device
          # descriptors, XInput, Native K/M, USB Host, parsers, or core mapping.
          git diff --exit-code "${UI5K_BASE}" -- \
            oag/firmware/tusb_config.h \
            oag/firmware/src/usb_descriptors.cpp \
            oag/firmware/src/pc_xinput_device.cpp \
            oag/firmware/src/pc_xinput_platform_driver.cpp \
            oag/firmware/src/pc_native_km_output.cpp \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/usb_pio_probe.c \
            oag/firmware/src/xinput_host.cpp \
            oag/firmware/src/bluetooth_hid_parser_v2.cpp \
            oag/include \
            oag/src

          python3 - <<'PY'
          from pathlib import Path

          main = Path("oag/firmware/src/main.cpp").read_text()
          cmake = Path("oag/firmware/CMakeLists.txt").read_text()
          bt_cfg = Path("oag/firmware/btstack_config.h").read_text()
          host_h = Path("oag/firmware/include/oag/firmware/bluetooth_host_v2.h").read_text()
          host = Path("oag/firmware/src/bluetooth_host_v2.cpp").read_text()
          out = Path("oag/firmware/src/bluetooth_platform_output.cpp").read_text()
          gatt = Path("oag/firmware/oag_ble_platform.gatt").read_text()
          desc = Path("oag/firmware/src/usb_descriptors.cpp").read_text()

          # UI5K Windows/KM contract remains intact.
          assert "PcXinputPlatformDriver platformOutput_" in main
          assert "PcNativeKmOutput nativeKmOutput_" in main
          assert "NativeKmComboEngine nativeKmCombos_" in main
          assert "kKeyboardMouseModeHoldUs = 2000000ull" in main
          assert "serviceKeyboardMouseModeToggle()" in main
          assert "serviceNativeKeyboardMouseOutput()" in main
          assert "sizeof(kConfigurationDescriptor) == 0x0173" in desc
          assert "sizeof(kExtendedCompatIdDescriptor) == 0x70" in desc

          # OUT13: UI5K keeps the BLE output backend, but BluetoothHostV2 is
          # removed from runtime initialization entirely.
          assert '#include "oag/firmware/bluetooth_platform_output.h"' in main
          assert "BluetoothPlatformOutput bluetoothPlatformOutput_" in main
          assert "bluetoothPlatformOutput_.initializeStandalone()" in main
          assert "bluetoothHost_.initialize(*this)" not in main
          assert "bluetoothHost_.startController()" not in main
          assert "bluetoothHost_.poll();" not in main
          assert "bluetoothPlatformOutput_.poll()" in main
          assert "bluetoothPlatformOutput_.submit(primary)" in main
          assert "bluetoothPlatformOutput_.submit(output)" in main
          assert "src/bluetooth_platform_output.cpp" in cmake
          assert "pico_btstack_make_gatt_header(" in cmake

          # BLE HOG output, advertising, pairing, and report format.
          assert "hids_device_init_with_storage(" in out
          assert "gHidReportStorage[2]" in out
          assert "hids_device_register_get_report_callback(" not in out
          assert "REPORT_REFERENCE, READ, 1, 1" in gatt
          assert "REPORT_REFERENCE, READ, 5, 3" in gatt
          assert "BOOT_KEYBOARD_INPUT_REPORT" in gatt
          assert "BOOT_MOUSE_INPUT_REPORT" in gatt
          assert "GATT_DATABASE_HASH" not in gatt
          assert "hids_device_send_input_report_for_id(" in out
          assert "GAP_SUBEVENT_LE_CONNECTION_COMPLETE" in out
          assert "gap_advertisements_enable(1)" in out
          assert "ORG_BLUETOOTH_SERVICE_HUMAN_INTERFACE_DEVICE" in out
          assert "SM_AUTHREQ_BONDING |" in out
          assert "SM_AUTHREQ_SECURE_CONNECTION" in out
          assert "SM_AUTHREQ_SECURE_CONNECTION |" in out
          assert "SM_AUTHREQ_BONDING" in out
          assert "kInputReportId = 1u" in Path(
              "oag/firmware/include/oag/firmware/bluetooth_platform_output.h"
          ).read_text()
          assert "std::array<std::uint8_t, 17> report_" in Path(
              "oag/firmware/include/oag/firmware/bluetooth_platform_output.h"
          ).read_text()

          # OUT13 deliberately makes the BLE output backend the sole BTstack
          # owner, mirroring the hardware-proven standalone Arduino-Pico path.
          assert "cyw43_arch_init()" in out
          assert "\n        l2cap_init();" in out
          assert "\n        sm_init();" in out
          assert "att_server_init(" in out
          assert "profile_data" in out
          assert "hci_power_control(HCI_POWER_ON);" in out
          assert out.index("gap_advertisements_enable(1)") < out.index("hci_power_control(HCI_POWER_ON);")

          # G2 Android compatibility rule.
          assert "#define ENABLE_LE_SECURE_CONNECTIONS" in bt_cfg
          assert "#define ENABLE_CROSS_TRANSPORT_KEY_DERIVATION" not in bt_cfg

          # OUT12 mirrors Arduino-Pico JoystickBLE ATT/HIDS layout.
          assert "PRIMARY_SERVICE, ORG_BLUETOOTH_SERVICE_HUMAN_INTERFACE_DEVICE" in gatt
          assert "REPORT_REFERENCE, READ, 1, 1" in gatt
          assert "#import <battery_service.gatt>" in gatt
          assert "#import <device_information_service.gatt>" in gatt
          assert "BOOT_KEYBOARD_INPUT_REPORT" in gatt
          assert "BOOT_MOUSE_INPUT_REPORT" in gatt
          assert "OAG Universal Pad" in gatt
          assert "hids_device_register_get_report_callback(" not in out
          assert "0xCAFE" in out
          assert "0x4016" in out
          assert "HCI_EVENT_LE_META" in out
          assert "HCI_SUBEVENT_LE_CONNECTION_COMPLETE" in out
          assert "if (connectionHandle_ == kInvalidHandle)" in out
          assert "The HIDS subscription event is authoritative for the ATT link." in out
          assert "BtstackContextLock" in out
          assert "async_context_acquire_lock_blocking" in out
          assert "async_context_release_lock" in out
          assert "Arduino-Pico JoystickBLE compatibility profile." in out
          assert "startConnectionSelfTest()" in out
          assert "unlockInputDiscoveryAfterPlatformSubscription();" in out
          assert "serviceConnectionSelfTest()" in out
          assert "report_ = liveReport_;" in out
          assert "probe[12] = 5u;" in out
          assert "storeLe16(probe, 0, 32767);" in out
          host = Path("oag/firmware/src/bluetooth_host_v2.cpp").read_text()
          main = Path("oag/firmware/src/main.cpp").read_text()
          assert "bluetoothPlatformOutput_.initializeStandalone()" in main
          assert "bluetoothHost_.initialize(*this)" not in main
          assert "bluetoothHost_.startController()" not in main
          assert "bluetoothHost_.poll();" not in main
          assert "0x29, 0x20" in out

          # Existing Bluetooth input path invariants remain present.
          assert "requestPairingAssist()" in host
          assert "ERROR_CODE_PIN_OR_KEY_MISSING" in host
          assert "kLeLowLatencyIntervalMin = 6u" in host
          assert "kLeLowLatencyIntervalMax = 12u" in host

          print("UI5K_BT_OUT13_STANDALONE_OWNER_MINIMAL_DELTA=PASS")
          print("UI5K_USB_XINPUT_KM_PROTECTED=PASS")
          print("BT_HOST_PLUS_BLE_PERIPHERAL_ARCH=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware-ui5k-win-xusb20-4func-km-composite-2s:
    needs: ui5k-win-xusb20-4func-km-composite-2s-policy-and-tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Pico SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-u9d
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-u9d rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-u9d/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-u9d/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-u9d" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Configure and build Pico 2 W firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-u9d" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Discover outputs and generate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2_FILES[@]}" -eq 1
          test "${#ELF_FILES[@]}" -eq 1
          test "${#MAP_FILES[@]}" -eq 1

          arm-none-eabi-size "${ELF_FILES[0]}" | tee artifacts/size-report.txt

          python3 oag/tools/generate_build_manifest.py \
            build/oag-fw \
            artifacts/build-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/build-manifest.json").read_text())
          f = manifest["features"]

          assert manifest["phase"] == "U10F-PM1-UI5K-BT-OUT13-STANDALONE-OWNER"
          assert f["universal_input_ui1"] is True
          assert f["usb_report_protocol_keyboard"] is True
          assert f["usb_report_protocol_mouse"] is True
          assert f["usb_composite_hid_descriptor_routing"] is True
          assert f["usb_hid_auto_button_layout"] is True
          assert f["xusb_input"] is True
          assert f["wired_xgip_input"] is True
          assert f["generic_hid_gamepad_host"] is True
          assert f["razer_xbox_family_input_profiles"] is True
          assert f["razer_wolverine_v3_pro_1532_0a3f"] is True
          assert f["razer_wolverine_v3_tournament_1532_0a43"] is True
          assert f["easysmx_x15_receiver_1a34_f517"] is True
          assert f["easysmx_legacy_receiver_2f24_0091"] is True
          assert f["easysmx_generic_hid_bluetooth_fallback"] is True
          assert f["km_primary_extra_bind_slots"] == 6
          assert f["km_primary_extra_keyboard_slots"] == 4
          assert f["km_primary_extra_mouse_slots"] == 2
          assert f["km_extra_runtime_reconfigurable_in_mapper"] is True
          assert f["km_mouse_overlay_primary_only"] is True
          assert f["km_global_mode_toggle"] == "F4+F5"
          assert f["km_global_mode_hold_ms"] == 2000
          assert f["km_default_mode"] == "NATIVE_KEYBOARD_MOUSE"
          assert f["km_reserved_chord_never_forwarded"] is True
          assert f["pc_native_keyboard_output"] is True
          assert f["pc_native_mouse_output"] is True
          assert f["pc_native_hid_interfaces"] == 2
          assert f["windows_usb_parent_composite"] is True
          assert f["windows_usb_vid"] == "CAFE"
          assert f["windows_usb_pid"] == "4016"
          assert f["windows_xusb20_compatible_id"] is True
          assert f["windows_xusb20_receiver_interfaces"] == 8
          assert f["windows_xusb20_function_count"] == 4
          assert f["windows_xusb20_interfaces_per_function"] == 2
          assert f["windows_xusb20_function_first_interfaces"] == [0, 2, 4, 6]
          assert f["windows_hid_interfaces"] == 2
          assert f["windows_usb_mode_switch_reenumerates"] is False
          assert f["native_km_combo_engine"] is True
          assert f["native_km_combo_slots"] == 8
          assert f["km_mouse_sensitivity_x"] == 1.0
          assert f["km_mouse_response_exponent"] == 0.58
          assert f["km_mouse_anti_deadzone_x"] == 0.0
          assert f["mouse_aim_recenter_us"] == 10000
          assert f["km_extra_default_keyboard_usages"] == ["1", "2", "3", "4"]

          assert f["pc_generic_hid_output"] is False
          assert f["pc_generic_hid_output_slots"] == 0
          assert f["pc_xinput_output"] is True
          assert f["pc_xinput_output_slots"] == 4
          assert f["multi_xinput_output"] is True
          assert f["slot_scoped_rumble_reverse"] is True
          assert f["rumble_reverse_runtime"] is True

          assert f["bluetooth_host_v2"] is True
          assert f["bluetooth_host_only"] is False
          assert f["bluetooth_peripheral_output"] is True
          assert f["bluetooth_peripheral_transport"] == "BLE_HID_OVER_GATT"
          assert f["bluetooth_peripheral_profile"] == "PURE_GENERIC_BLE_HID_GAMEPAD"
          assert f["bluetooth_peripheral_primary_only"] is True
          assert f["bluetooth_peripheral_input_report_count"] == 1
          assert f["bluetooth_peripheral_report_bytes"] == 17
          assert f["bluetooth_peripheral_pnp_vid"] == "CAFE"
          assert f["bluetooth_peripheral_pnp_pid"] == "4016"
          assert f["bluetooth_peripheral_dual_connection_event_capture"] is True
          assert f["bluetooth_peripheral_hids_handle_adoption"] is True
          assert f["bluetooth_peripheral_reference"] == "ARDUINO_PICO_JOYSTICKBLE_GAMEPAD16"
          assert f["bluetooth_peripheral_btstack_async_lock"] is True
          assert f["bluetooth_peripheral_registered_before_hci_power_on"] is True
          assert f["bluetooth_host_split_stack_setup_and_power_on"] is True
          assert f["bluetooth_shared_sm_secure_connections_prepower"] is True
          assert f["bluetooth_shared_sm_secure_connections_persistent"] is True
          assert f["bluetooth_connection_selftest"] is True
          assert f["bluetooth_connection_selftest_step_ms"] == 900
          assert f["bluetooth_connection_selftest_steps"] == 6
          assert f["bluetooth_connection_selftest_then_live_primary"] is True
          assert f["bluetooth_phone_first_bootstrap"] is True
          assert f["bluetooth_input_discovery_locked_until_platform_hids_subscription"] is True
          assert f["bluetooth_input_discovery_unlock_event"] == "DISABLED_IN_OUT11"
          assert f["bluetooth_input_host_isolated"] is True
          assert f["bluetooth_ble_hids_host_initialized"] is False
          assert f["bluetooth_classic_hid_host_initialized"] is False
          assert f["bluetooth_gatt_client_initialized"] is False
          assert f["bluetooth_usb_pio_input_still_enabled"] is True
          assert f["bluetooth_peripheral_att_profile"] == "ARDUINO_PICO_JOYSTICKBLE_COMPAT"
          assert f["bluetooth_peripheral_hids_storage_reports"] == 2
          assert f["bluetooth_peripheral_get_report_callback"] is False
          assert f["bluetooth_peripheral_boot_characteristics_present"] is True
          assert f["bluetooth_peripheral_feature_report_characteristic_present"] is True
          assert f["bluetooth_runtime_owner"] == "BLUETOOTH_PLATFORM_OUTPUT_STANDALONE"
          assert f["bluetooth_host_v2_runtime_initialized"] is False
          assert f["bluetooth_platform_output_owns_cyw43_init"] is True
          assert f["bluetooth_platform_output_owns_l2cap_sm_att_hci"] is True
          assert f["bluetooth_advertising_configured_before_hci_power_on"] is True
          assert f["bluetooth_ctkd"] is False
          assert f["usb_root_ports"] == 3
          assert f["usb_hub_host"] is True
          assert f["keyboard_boot_host"] is True
          assert f["mouse_boot_host"] is True

          print("BUILD_MANIFEST_UI5K_BT_OUT13_STANDALONE_OWNER=PASS")
          PY

          SHORT_SHA="${GITHUB_SHA::8}"
          cp "${UF2_FILES[0]}" "artifacts/OAG_U10F-PM1-UI5K-BT-OUT13-STANDALONE-OWNER_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF_FILES[0]}" "artifacts/OAG_U10F-PM1-UI5K-BT-OUT13-STANDALONE-OWNER_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP_FILES[0]}" "artifacts/OAG_U10F-PM1-UI5K-BT-OUT13-STANDALONE-OWNER_${SHORT_SHA}_Pico2W.map"
          sha256sum artifacts/OAG_U10F-PM1-UI5K-BT-OUT13-STANDALONE-OWNER_* > artifacts/SHA256SUMS.txt

      - name: Upload UI5K-BT-OUT13-STANDALONE-OWNER Android BLE gamepad candidate bundle
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-U10F-PM1-UI5K-BT-OUT13-STANDALONE-OWNER-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

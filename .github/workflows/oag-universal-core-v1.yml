name: OAG Universal Core V1

on:
  push:
    branches:
      - chatgpt/oag-universal-core-v1
    paths:
      - 'oag/**'
      - 'docs/oag-universal-core-v1/**'
      - '.github/workflows/oag-universal-core-v1.yml'
      - '.gitmodules'
      - 'lib/pico_pio_usb'
      - 'lib/tinyusb'
  workflow_dispatch:

jobs:
  core-policy-and-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 2

      - name: Verify branch ownership
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "chatgpt/oag-universal-core-v1"

      - name: Verify U9F functional source is frozen to hardware-verified U9E
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "aed44da64f668553e24eb8f4a60a991725318932"
          git diff --exit-code aed44da64f668553e24eb8f4a60a991725318932 -- oag/firmware/src oag/src
          echo "U9F_U9E_FUNCTIONAL_SOURCE_FREEZE=PASS"

      - name: Verify no Antigravity coupling
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "antigravity/g2e3-work" oag

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2

      - name: Run host tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/oag-host --output-on-failure

  firmware-u9f:
    needs: core-policy-and-tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Arduino-Pico 6.1.1 SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-u9d
          submodules: recursive
          fetch-depth: 1

      - name: Verify exact U9F SDK and Bluetooth dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-u9d rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-u9d/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-u9d/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-u9d" >> "${GITHUB_ENV}"
          echo "U9F_PICO_SDK_230=PASS"
          echo "U9F_BTSTACK_HIDS_HOST=PASS"

      - name: Verify and prepare pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/prepare_dependencies.py

      - name: Configure Pico 2 W U9F firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-u9d" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s

      - name: Build Pico 2 W U9F firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-fw --parallel 2

      - name: Discover and verify firmware outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "Top-level firmware outputs:"
          find build/oag-fw -maxdepth 1 -type f -printf '%f\n' | sort

          mapfile -t UF2_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2_FILES[@]}" -eq 1
          test "${#ELF_FILES[@]}" -eq 1
          test "${#MAP_FILES[@]}" -eq 1

          echo "OAG_UF2_PATH=${UF2_FILES[0]}" >> "${GITHUB_ENV}"
          echo "OAG_ELF_PATH=${ELF_FILES[0]}" >> "${GITHUB_ENV}"
          echo "OAG_MAP_PATH=${MAP_FILES[0]}" >> "${GITHUB_ENV}"

      - name: Generate size report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          arm-none-eabi-size "${OAG_ELF_PATH}" | tee artifacts/size-report.txt

      - name: Generate and verify build manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/generate_build_manifest.py \
            build/oag-fw \
            artifacts/build-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/build-manifest.json").read_text())
          assert manifest["phase"] == "U9F"
          assert manifest["features"]["usb_hub_host"] is True
          assert manifest["features"]["wired_xgip_input"] is True
          assert manifest["features"]["xgip_host_init_sequence"] is True
          assert manifest["features"]["generic_hid_structural_fallback"] is True
          assert manifest["features"]["known_usb_controller_classifier"] is True
          assert manifest["features"]["usb_host_device_capacity"] == 12
          assert manifest["features"]["usb_host_hub_capacity"] == 4
          assert manifest["features"]["logical_gamepad_slots"] == 8
          assert manifest["features"]["host_enumeration_buffer_bytes"] == 1024
          assert manifest["features"]["pc_generic_hid_output"] is False
          assert manifest["features"]["pc_xinput_output"] is True
          assert manifest["features"]["pc_xinput_output_slots"] == 4
          assert manifest["features"]["multi_xinput_output"] is True
          assert manifest["features"]["slot0_keyboard_mouse_overlay"] is True
          assert manifest["features"]["slot_scoped_rumble_reverse"] is True
          assert manifest["features"]["rumble_reverse_runtime"] is True
          assert manifest["features"]["host_root_watchdog_2s"] is False
          assert manifest["features"]["golden_usb_host_clock_120mhz"] is True
          assert manifest["features"]["golden_xusb_continuous_rearm"] is True
          assert manifest["features"]["keyboard_boot_host"] is True
          assert manifest["features"]["keyboard_lock_led_output"] is True
          assert manifest["features"]["keyboard_default_numlock_led"] is True
          assert manifest["features"]["g808_skip_set_idle_golden_quirk"] is True
          assert manifest["features"]["mouse_boot_host"] is True
          assert manifest["features"]["generic_hid_gamepad_host"] is True
          assert manifest["features"]["platform_profile_registry"] is True
          assert manifest["features"]["platform_output_runtime_abstraction"] is True
          assert manifest["features"]["keyboard_mouse_runtime_gamepad"] is True
          assert manifest["features"]["bluetooth"] is True
          assert manifest["features"]["bluetooth_host_v2"] is True
          assert manifest["features"]["bluetooth_host_only"] is True
          assert manifest["features"]["bluetooth_peripheral_output"] is False
          assert manifest["features"]["bluetooth_max_simultaneous_peers"] == 4
          assert manifest["features"]["bluetooth_ble_hid_host"] is True
          assert manifest["features"]["bluetooth_classic_hid_host"] is True
          assert manifest["features"]["bluetooth_gamepad_input"] is True
          assert manifest["features"]["bluetooth_keyboard_input"] is True
          assert manifest["features"]["bluetooth_mouse_input"] is True
          assert manifest["features"]["bluetooth_g2e3_transport_sequence"] is True
          assert manifest["features"]["bluetooth_init_after_usb_host_ms"] == 100
          assert manifest["features"]["bluetooth_historical_hidmaster_compatibility"] is True
          assert manifest["features"]["bluetooth_local_gap_att_server"] is True
          assert manifest["features"]["bluetooth_scan_uuid_1812_only"] is True
          assert manifest["features"]["bluetooth_scan_type"] == "passive"
          assert manifest["features"]["bluetooth_scan_interval"] == 75
          assert manifest["features"]["bluetooth_scan_window"] == 50
          assert manifest["features"]["bluetooth_deferred_connect_outside_adv_callback"] is True
          assert manifest["features"]["bluetooth_u9c_bond_reset_version"] == 2
          assert manifest["features"]["bluetooth_u9d_exact_stack_generation"] is True
          assert manifest["features"]["bluetooth_hids_api"] == "hids_host"
          assert manifest["features"]["bluetooth_sdk_23_migration"] is True
          assert manifest["features"]["bluetooth_u9d_bond_reset_version"] == 3
          assert manifest["features"]["bluetooth_u9e_live_hid_report_dispatch_fix"] is True
          assert manifest["features"]["bluetooth_hids_host_accepts_gattservice_packet_type"] is True
          assert manifest["features"]["bluetooth_u9f_baseline_freeze"] is True
          assert manifest["features"]["u9f_functional_source_frozen_to_u9e"] is True
          assert manifest["verification"]["hardware_verified"] is False
          assert manifest["verification"]["hardware_verified_baseline_phase"] == "U9E"
          assert manifest["verification"]["hardware_verified_baseline_sha"] == "aed44da64f668553e24eb8f4a60a991725318932"
          assert manifest["verification"]["u9f_simultaneous_wired_bluetooth_regression"] == "PENDING_HARDWARE"
          assert manifest["dependencies"]["pico_sdk"] == "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          assert manifest["dependencies"]["btstack"] == "075a0780f0fad7ff67d58ac19f46e8953656a752"
          assert manifest["dependencies"]["cyw43_driver"] == "055d64274b014dd7b1c2fc94d26e8a18face7124"
          assert manifest["features"]["mouse_aim_recenter_us"] == 6000
          assert manifest["features"]["default_platform_profile"] == "PC_XINPUT_360"
          assert manifest["pc_xinput_profile"]["console_authentication"] is False
          assert manifest["dependencies"]["pico_pio_usb"] == "5a37a66dc5d3fbe0ef3cdbeda923a757440f984f"
          assert manifest["dependencies"]["tinyusb"] == "9865cba11ecbcdd25237ba9cf4ccbe3fd1fd821d"
          assert manifest["verification"]["ci_verified"] is True
          print("OAG_MANIFEST_VERIFY=PASS")
          PY

      - name: Package exact-SHA artifacts
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"

          cp "${OAG_UF2_PATH}" \
            "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U9F_${SHORT_SHA}_Pico2W.uf2"

          cp "${OAG_ELF_PATH}" \
            "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U9F_${SHORT_SHA}_Pico2W.elf"

          cp "${OAG_MAP_PATH}" \
            "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U9F_${SHORT_SHA}_Pico2W.map"

      - name: Upload U9F firmware bundle
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-Abo-Gemi-Ultra-Gaming-U9F-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

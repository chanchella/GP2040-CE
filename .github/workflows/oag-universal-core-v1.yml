name: OAG Universal Core V1

on:
  push:
    branches:
      - chatgpt/oag-universal-core-v1
    paths:
      - 'oag/**'
      - '.github/workflows/oag-universal-core-v1.yml'
      - '.gitmodules'
      - 'lib/pico_pio_usb'
      - 'lib/tinyusb'
  workflow_dispatch:

jobs:
  pc-hid2-policy-and-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify branch ownership and TRUE GOLDEN ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "chatgpt/oag-universal-core-v1"
          TRUE_GOLDEN="59182f30c2028f77c059666d6473487d90a82b64"
          git merge-base --is-ancestor "${TRUE_GOLDEN}" HEAD

      - name: Verify isolated PC-HID2 runtime delta
        shell: bash
        run: |
          set -euo pipefail
          TRUE_GOLDEN="59182f30c2028f77c059666d6473487d90a82b64"

          ACTUAL_RUNTIME="$(git diff --name-only "${TRUE_GOLDEN}" -- \
            oag/firmware/CMakeLists.txt \
            oag/firmware/btstack_config.h \
            oag/firmware/include \
            oag/firmware/src \
            oag/firmware/tusb_config.h \
            oag/include \
            oag/src | sort)"

          EXPECTED_RUNTIME="$(printf '%s\n' \
            'oag/firmware/CMakeLists.txt' \
            'oag/firmware/include/oag/firmware/pc_hid_output.h' \
            'oag/firmware/include/oag/firmware/pc_hid_platform_driver.h' \
            'oag/firmware/src/main.cpp' \
            'oag/firmware/src/pc_hid_output.cpp' \
            'oag/firmware/src/pc_hid_platform_driver.cpp' \
            'oag/firmware/src/usb_descriptors.cpp' \
            'oag/firmware/tusb_config.h' | sort)"

          echo "=== PC_HID2_RUNTIME_DIFF ==="
          printf '%s\n' "${ACTUAL_RUNTIME}"
          test "${ACTUAL_RUNTIME}" = "${EXPECTED_RUNTIME}"

          # Input, transport, mapping, Bluetooth and host-side parser code must
          # remain byte-for-byte TRUE GOLDEN.
          git diff --exit-code "${TRUE_GOLDEN}" -- \
            oag/firmware/btstack_config.h \
            oag/firmware/include/oag/firmware/bluetooth_host_v2.h \
            oag/firmware/src/bluetooth_host_v2.cpp \
            oag/firmware/src/bluetooth_hid_parser_v2.cpp \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/usb_pio_probe.c \
            oag/firmware/src/xinput_host.cpp \
            oag/src/device \
            oag/src/mapping \
            oag/src/protocol \
            oag/src/feedback

          test ! -e oag/firmware/include/oag/firmware/bluetooth_platform_output.h
          test ! -e oag/firmware/src/bluetooth_platform_output.cpp
          test ! -e oag/firmware/oag_ble_platform.gatt

          python3 - <<'PY'
          from pathlib import Path

          main = Path("oag/firmware/src/main.cpp").read_text()
          cmake = Path("oag/firmware/CMakeLists.txt").read_text()
          tusb = Path("oag/firmware/tusb_config.h").read_text()
          desc = Path("oag/firmware/src/usb_descriptors.cpp").read_text()
          hid = Path("oag/firmware/src/pc_hid_output.cpp").read_text()
          platform = Path("oag/firmware/src/pc_hid_platform_driver.cpp").read_text()
          host = Path("oag/firmware/src/bluetooth_host_v2.cpp").read_text()

          assert "PcHidPlatformDriver platformOutput_" in main
          assert "PcXinputPlatformDriver platformOutput_" not in main
          assert "src/pc_hid_output.cpp" in cmake
          assert "src/pc_hid_platform_driver.cpp" in cmake
          assert "src/pc_xinput_device.cpp" not in cmake
          assert "src/pc_xinput_platform_driver.cpp" not in cmake

          assert "#define CFG_TUD_HID 4" in tusb
          assert "#define CFG_TUD_VENDOR 0" in tusb
          assert "#define CFG_TUD_ENDPOINT0_SIZE 64" in tusb

          assert "AOG Abo Gemi ultra gaming" in desc
          assert "kDeviceVid = 0xCAFE" in desc
          assert "kDevicePid = 0x4012" in desc
          assert "kPollingIntervalMs = 1" in desc
          assert "0x29, 0x10" in desc
          assert "0x09, 0x39" in desc
          for usage in ("0x09, 0x30", "0x09, 0x31", "0x09, 0x32",
                        "0x09, 0x33", "0x09, 0x34", "0x09, 0x35"):
              assert usage in desc

          assert "kButtonSouth = hidButton(1)" in hid
          assert "kButtonEast = hidButton(2)" in hid
          assert "kButtonWest = hidButton(3)" in hid
          assert "kButtonNorth = hidButton(4)" in hid
          assert "kButtonLeftBumper = hidButton(5)" in hid
          assert "kButtonRightBumper = hidButton(6)" in hid
          assert "kButtonBack = hidButton(7)" in hid
          assert "kButtonStart = hidButton(8)" in hid
          assert "kButtonLeftStick = hidButton(9)" in hid
          assert "kButtonRightStick = hidButton(10)" in hid
          assert "kButtonGuide = hidButton(11)" in hid
          assert "kButtonShare = hidButton(12)" in hid
          assert "tud_hid_n_report" in hid
          assert "return PlatformId::PcGenericHid;" in platform
          assert ".rumble = false" in platform

          # TRUE GOLDEN Bluetooth pairing/latency path remains present.
          assert "requestPairingAssist()" in host
          assert "ERROR_CODE_PIN_OR_KEY_MISSING" in host
          assert "kLeLowLatencyIntervalMin = 6u" in host
          assert "kLeLowLatencyIntervalMax = 12u" in host
          assert "gap_request_connection_parameter_update(" in host

          print("TRUE_GOLDEN_RUNTIME_PRESERVED=PASS")
          print("PC_HID2_ISOLATED_TARGET_OUTPUT=PASS")
          print("PC_HID2_6AXIS_16BUTTON_HAT=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware-pc-hid2:
    needs: pc-hid2-policy-and-tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Pico SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-u9d
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-u9d rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-u9d/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-u9d/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-u9d" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Configure and build Pico 2 W firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-u9d" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Discover outputs and generate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP_FILES < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2_FILES[@]}" -eq 1
          test "${#ELF_FILES[@]}" -eq 1
          test "${#MAP_FILES[@]}" -eq 1

          arm-none-eabi-size "${ELF_FILES[0]}" | tee artifacts/size-report.txt

          python3 oag/tools/generate_build_manifest.py \
            build/oag-fw \
            artifacts/build-manifest.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("artifacts/build-manifest.json").read_text())
          f = manifest["features"]

          assert manifest["phase"] == "U10F-PM1-PC-HID2"
          assert f["pc_generic_hid_output"] is True
          assert f["pc_generic_hid_output_slots"] == 4
          assert f["pc_generic_hid_axes"] == 6
          assert f["pc_generic_hid_buttons"] == 16
          assert f["pc_generic_hid_hat_switch"] is True
          assert f["pc_generic_hid_poll_interval_ms"] == 1
          assert f["pc_generic_hid_pid"] == "0x4012"
          assert f["pc_hid2_product_string"] == "AOG Abo Gemi ultra gaming"
          assert f["pc_hid2_windows_hid_class"] is True
          assert f["pc_hid2_button_order"] == "A_B_X_Y_LB_RB_BACK_START_L3_R3_GUIDE_SHARE"
          assert f["pc_hid2_axis_layout"] == "X_Y_LEFT__RX_RY_RIGHT__Z_RZ_LT_RT"
          assert f["pc_xinput_output"] is False
          assert f["bluetooth_host_v2"] is True
          assert f["bluetooth_host_only"] is True
          assert f["usb_root_ports"] == 3
          assert f["usb_hub_host"] is True
          assert f["keyboard_boot_host"] is True
          assert f["mouse_boot_host"] is True
          assert f["generic_hid_gamepad_host"] is True

          print("BUILD_MANIFEST_PC_HID2=PASS")
          PY

          SHORT_SHA="${GITHUB_SHA::8}"
          cp "${UF2_FILES[0]}" "artifacts/OAG_U10F-PM1-PC-HID2_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF_FILES[0]}" "artifacts/OAG_U10F-PM1-PC-HID2_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP_FILES[0]}" "artifacts/OAG_U10F-PM1-PC-HID2_${SHORT_SHA}_Pico2W.map"
          sha256sum artifacts/OAG_U10F-PM1-PC-HID2_* > artifacts/SHA256SUMS.txt

      - name: Upload PC-HID2 candidate bundle
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-U10F-PM1-PC-HID2-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

name: OAG Universal Core V1

on:
  push:
    branches:
      - chatgpt/oag-universal-core-v1
    paths:
      - 'oag/**'
      - 'docs/oag-universal-core-v1/**'
      - '.github/workflows/oag-universal-core-v1.yml'
  workflow_dispatch:

jobs:
  core-policy-and-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch
        uses: actions/checkout@v4.1.1

      - name: Verify branch ownership
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "chatgpt/oag-universal-core-v1"

      - name: Verify no Antigravity coupling
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "antigravity/g2e3-work" oag

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host             -DCMAKE_BUILD_TYPE=Release             -DOAG_BUILD_HOST_TESTS=ON

      - name: Build host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2

      - name: Run host tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/oag-host --output-on-failure

  firmware-u1-hw1:
    needs: core-policy-and-tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout ChatGPT OAG branch with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Verify and prepare pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/prepare_dependencies.py

      - name: Configure Pico 2 W U1 firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk"           cmake -S oag/firmware -B build/oag-fw             -DCMAKE_BUILD_TYPE=Release             -DPICO_BOARD=pico2_w             -DPICO_PLATFORM=rp2350-arm-s

      - name: Build Pico 2 W U1 firmware
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-fw --parallel 2

      - name: Verify firmware outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f build/oag-fw/OAG_Abo_Gemi_Ultra_Gaming_U1_Pico2W.uf2
          test -f build/oag-fw/OAG_Abo_Gemi_Ultra_Gaming_U1_Pico2W.elf
          test -f build/oag-fw/OAG_Abo_Gemi_Ultra_Gaming_U1_Pico2W.map

      - name: Generate size report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          arm-none-eabi-size             build/oag-fw/OAG_Abo_Gemi_Ultra_Gaming_U1_Pico2W.elf             | tee artifacts/size-report.txt

      - name: Generate build manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/generate_build_manifest.py             build/oag-fw             artifacts/build-manifest.json

      - name: Package exact-SHA artifacts
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::8}"
          cp build/oag-fw/OAG_Abo_Gemi_Ultra_Gaming_U1_Pico2W.uf2             "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U1_${SHORT_SHA}_Pico2W.uf2"
          cp build/oag-fw/OAG_Abo_Gemi_Ultra_Gaming_U1_Pico2W.elf             "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U1_${SHORT_SHA}_Pico2W.elf"
          cp build/oag-fw/OAG_Abo_Gemi_Ultra_Gaming_U1_Pico2W.map             "artifacts/OAG_Abo_Gemi_Ultra_Gaming_U1_${SHORT_SHA}_Pico2W.map"

      - name: Upload U1-HW1 firmware bundle
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-Abo-Gemi-Ultra-Gaming-U1-HW1-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

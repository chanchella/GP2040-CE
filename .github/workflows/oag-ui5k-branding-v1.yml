name: OAG UI5K Branding V1

on:
  push:
    branches:
      - chatgpt/ui5k-oag-branding-v1
    paths:
      - 'oag/firmware/src/usb_descriptors.cpp'
      - '.github/workflows/oag-ui5k-branding-v1.yml'
  workflow_dispatch:

jobs:
  guard-and-host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify protected baselines and strings-only scope
        shell: bash
        run: |
          set -euo pipefail

          BASE="5d41992109d16570b6b2ed70e0c5dd3e284d7b01"
          UI5K="01af260742a6a402a851cceef0707ae69bd6a301"
          PHONE_V3="2429dff3877204112b520cdc51941c489b2eecbb"
          MULTIPROFILE="5a1cee019bcad6b6329bf52ed0e24a743c372a7b"

          test "$(git merge-base "${BASE}" HEAD)" = "${BASE}"
          test "$(git rev-parse origin/golden/ui5k-protocol-routing-dinput-hw)" = "${BASE}"
          test "$(git rev-parse origin/golden/ui5k-multiprofile-pc-phone-hw)" = "${MULTIPROFILE}"
          test "$(git rev-parse "${UI5K}")" = "${UI5K}"
          test "$(git rev-parse origin/golden/ui5k-mobile-otg-v3-hw)" = "${PHONE_V3}"

          ACTUAL="$(git diff --name-only "${BASE}" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/oag-ui5k-branding-v1.yml' \
            'oag/firmware/src/usb_descriptors.cpp' | sort)"
          test "${ACTUAL}" = "${EXPECTED}"

          # No runtime/input/output architecture may change.
          git diff --exit-code "${BASE}" HEAD -- \
            oag/firmware/src/main.cpp \
            oag/firmware/tusb_config.h \
            oag/firmware/src/output_profile_selector.cpp \
            oag/firmware/src/multi_profile_platform_driver.cpp \
            oag/firmware/src/pc_hid_output.cpp \
            oag/firmware/src/pc_xinput_device.cpp \
            oag/firmware/src/pc_native_km_output.cpp \
            oag/firmware/src/bluetooth_host_v2.cpp \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/xinput_host.cpp \
            oag/src/protocol/hid/generic_hid_gamepad_driver.cpp \
            oag/src/device/usb_device_classifier.cpp

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          p = Path("oag/firmware/src/usb_descriptors.cpp")
          text = p.read_text()

          assert 'return "OAG ABO GEMI ULTRA GAMING";' in text
          assert '"OAG Mobile USB Gamepad"' not in text
          assert '"AOG Abo Gemi ultra gaming"' not in text

          diff = subprocess.check_output(
              ["git","diff","5d41992109d16570b6b2ed70e0c5dd3e284d7b01","HEAD","--",str(p)],
              text=True,
          )

          # String-only safety: immutable USB identity/topology tokens must
          # still be present in the candidate source.
          for token in [
              "constexpr std::uint16_t kPcReceiverVid = 0xCAFE;",
              "constexpr std::uint16_t kPcReceiverPid = 0x4016;",
              "constexpr std::uint16_t kMobileDeviceVid = 0xCAFE;",
              "constexpr std::uint16_t kMobileDevicePid = 0x4017;",
              "kPcExtendedCompatIdDescriptor",
              "kPcConfigurationDescriptor",
              "kMobileConfigurationDescriptor",
              "kMobileGamepadReportDescriptor",
          ]:
              assert token in text

          # The diff must contain no descriptor numeric/topology edits.
          changed = [
              line for line in diff.splitlines()
              if line.startswith(("+","-"))
              and not line.startswith(("+++","---"))
          ]
          allowed_fragments = (
              'case 2:',
              'return mobileProfile()',
              '? "OAG Mobile USB Gamepad"',
              ': "AOG Abo Gemi ultra gaming";',
              '// Branding only.',
              '// VID/PID, interfaces, endpoints and compatibility descriptors',
              '// untouched; this changes only the USB device Product String.',
              'return "OAG ABO GEMI ULTRA GAMING";',
          )
          for line in changed:
              body = line[1:].strip()
              if not any(fragment in body for fragment in allowed_fragments):
                  raise AssertionError(f"Unexpected usb_descriptors change: {line}")

          print("BRANDING_STRINGS_ONLY_GUARD=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware:
    needs: guard-and-host-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact UI5K Pico SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned SDK generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-ui5k rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-ui5k" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Configure and build Pico 2 W firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-ui5k" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t UF2 < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2[@]}" -eq 1
          test "${#ELF[@]}" -eq 1
          test "${#MAP[@]}" -eq 1

          SHORT_SHA="${GITHUB_SHA::8}"
          cp "${UF2[0]}" "artifacts/OAG_ABO_GEMI_ULTRA_GAMING_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF[0]}" "artifacts/OAG_ABO_GEMI_ULTRA_GAMING_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP[0]}" "artifacts/OAG_ABO_GEMI_ULTRA_GAMING_${SHORT_SHA}_Pico2W.map"

          sha256sum artifacts/OAG_ABO_GEMI_ULTRA_GAMING_* > artifacts/SHA256SUMS.txt

          printf '%s\n' \
            "HARDWARE_BASE=5d41992109d16570b6b2ed70e0c5dd3e284d7b01" \
            "CHANGE_SCOPE=USB_PRODUCT_STRING_ONLY" \
            "PRODUCT_STRING=OAG ABO GEMI ULTRA GAMING" \
            "WINDOWS_XINPUT_CHILD_NAMES=UNCHANGED" \
            "VID_PID=UNCHANGED" \
            "USB_TOPOLOGY=UNCHANGED" \
            > artifacts/BUILD-INFO.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-UI5K-BRANDING-V1-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

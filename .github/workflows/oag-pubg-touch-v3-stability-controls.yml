name: OAG PUBG Touch V3 Stability Controls

on:
  push:
    branches:
      - chatgpt/pubg-touch-v3-stability-controls
    paths:
      - 'oag/firmware/include/oag/firmware/mobile_touch_output.h'
      - 'oag/firmware/src/mobile_touch_output.cpp'
      - 'oag/firmware/src/main.cpp'
      - 'oag/include/oag/output/touch/mobile_touch_mapper.h'
      - 'oag/src/output/touch/mobile_touch_mapper.cpp'
      - 'oag/tests/host/test_mobile_touch_mapper.cpp'
      - '.github/workflows/oag-pubg-touch-v3-stability-controls.yml'
  workflow_dispatch:

jobs:
  guard-and-host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify isolated PUBG Touch V3 scope
        shell: bash
        run: |
          set -euo pipefail

          GOLDEN="19b84f3c458384f75a44cc394da8269e49e57340"
          TOUCH_BASE="5a087b4d062e7a123109d5d8d6abb6d32ec9e154"
          GAME1_V3_BASE="17eb3105147191e4aa01bc8b630d5c59999d115f"
          GAME1_V4_BASE="9e399f8ca6410bd0cb88f76c69d5bba8ce1b9d69"
          GAME1_V5_BASE="85d8ea8bf4e7b040a27b283a38b04df4d79987e5"
          PUBG_V1_BASE="c0d608e2fcc7c95230dd415b4eae67757851cf29"
          PUBG_V2_BASE="9d05260fbd93f8b4ebef1be9a505b5e3e49cba1a"

          test "$(git merge-base "${TOUCH_BASE}" HEAD)" = "${TOUCH_BASE}"
          test "$(git rev-parse origin/golden/ui5k-oag-abo-gemi-ultra-gaming-v1)" = "${GOLDEN}"

          ACTUAL="$(git diff --name-only "${PUBG_V2_BASE}" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/oag-pubg-touch-v3-stability-controls.yml' \
            'oag/firmware/include/oag/firmware/mobile_touch_output.h' \
            'oag/firmware/src/mobile_touch_output.cpp' \
            'oag/firmware/src/main.cpp' \
            'oag/include/oag/output/touch/mobile_touch_mapper.h' \
            'oag/src/output/touch/mobile_touch_mapper.cpp' \
            'oag/tests/host/test_mobile_touch_mapper.cpp' | sort)"

          echo "=== PUBG TOUCH V3 CHANGE SCOPE ==="
          printf '%s\n' "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

          # USB descriptor/persona and every unrelated Golden path stay unchanged.
          git diff --exit-code "${PUBG_V2_BASE}" HEAD -- \
            oag/firmware/src/usb_descriptors.cpp \
            oag/firmware/tusb_config.h \
            oag/firmware/src/mobile_touch_platform_driver.cpp \
            oag/firmware/src/multi_profile_platform_driver.cpp \
            oag/firmware/src/output_profile_selector.cpp \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/xinput_host.cpp \
            oag/firmware/src/bluetooth_host_v2.cpp \
            oag/src/protocol/hid/generic_hid_gamepad_driver.cpp

          python3 - <<'PY'
          import re
          from pathlib import Path

          mapper_h = Path("oag/include/oag/output/touch/mobile_touch_mapper.h").read_text()
          mapper = Path("oag/src/output/touch/mobile_touch_mapper.cpp").read_text()
          tests = Path("oag/tests/host/test_mobile_touch_mapper.cpp").read_text()
          out_h = Path("oag/firmware/include/oag/firmware/mobile_touch_output.h").read_text()
          out_cpp = Path("oag/firmware/src/mobile_touch_output.cpp").read_text()
          main = Path("oag/firmware/src/main.cpp").read_text()

          for token in [
              "kMouseLookCenterX = 16384",
              "kMouseLookCenterY = 16384",
              "kMouseLookMinX = 9193",
              "kMouseLookMaxX = 23605",
              "kMouseLookMinY = 12816",
              "kMouseLookMaxY = 19952",
              "kShiftX = 26093", "kShiftY = 26415",
              "kMouseRightX = 15929", "kMouseRightY = 30600",
              "kRX = 2336", "kRY = 25386",
              "kScrollDownX = 3034", "kScrollDownY = 14408",
              "kScrollUpX = 3034", "kScrollUpY = 17907",
              "kMouseMiddleX = 2488", "kMouseMiddleY = 21612",
              "kFX = 20632", "kFY = 22367",
              "kGX = 2731", "kGY = 10978",
          ]:
              assert token in mapper, token

          ids = [int(x) for x in re.findall(r'k\w+ContactId\s*=\s*(\d+)', mapper)]
          assert ids and max(ids) <= 15, ids

          for token in [
              "kPubgKeyGUsage = 0x0A",
              "kPubgKeyRUsage = 0x15",
              "kPubgShiftButton",
              "kPubgMouseRightButton",
              "kPubgMouseMiddleButton",
              "kPubgScrollDownButton",
              "kPubgScrollUpButton",
              "kPubgScrollPulseUs = 40000",
          ]:
              assert token in main or token in mapper_h, token

          for token in [
              "kActiveHeartbeatUs = 8000",
              "lastAcceptedReportUs_",
          ]:
              assert token in out_h, token

          for token in [
              "Keep every active touch alive at 125 Hz",
              "lastAcceptedReportUs_ = time_us_64()",
              "desiredFrame_.count == 0",
              "needsBridge",
              "report_.contactCount = reportedContacts",
              "tud_hid_n_ready(0)",
              "tud_hid_n_report",
          ]:
              assert token in out_cpp, token

          for token in [
              "assert(cameraAndFire.count == 2)",
              "assert(findContact(fireOnly, 0) == nullptr)",
              "assertPoint(actions.map(shift), 10, 26093, 26415)",
              "assertPoint(actions.map(rightClick), 11, 15929, 30600)",
              "assertPoint(actions.map(r), 12, 2336, 25386)",
              "assertPoint(actions.map(scrollDown), 13, 3034, 14408)",
              "assertPoint(actions.map(scrollUp), 6, 3034, 17907)",
              "assertPoint(actions.map(middle), 14, 2488, 21612)",
              "assertPoint(actions.map(f), 4, 20632, 22367)",
              "assertPoint(actions.map(g), 15, 2731, 10978)",
          ]:
              assert token in tests, token

          print("PUBG_TOUCH_V3_GUARD=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Build and run all host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host             -DCMAKE_BUILD_TYPE=Release             -DOAG_BUILD_HOST_TESTS=ON
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware:
    needs: guard-and-host-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Golden Pico SDK
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-ui5k rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-ui5k" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Build Pico 2 W candidate
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-ui5k"           cmake -S oag/firmware -B build/oag-fw             -DCMAKE_BUILD_TYPE=Release             -DPICO_BOARD=pico2_w             -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2 < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2[@]}" -eq 1
          test "${#ELF[@]}" -eq 1
          test "${#MAP[@]}" -eq 1

          SHORT_SHA="${GITHUB_SHA::8}"
          cp "${UF2[0]}" "artifacts/OAG_PUBG_TOUCH_V3_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF[0]}" "artifacts/OAG_PUBG_TOUCH_V3_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP[0]}" "artifacts/OAG_PUBG_TOUCH_V3_${SHORT_SHA}_Pico2W.map"

          sha256sum artifacts/OAG_PUBG_TOUCH_V3_* > artifacts/SHA256SUMS.txt

          printf '%s\n' \
            "GOLDEN_BASE=19b84f3c458384f75a44cc394da8269e49e57340" \
            "TOUCH_BASE=5a087b4d062e7a123109d5d8d6abb6d32ec9e154" \
            "PROFILE_0=PC_GOLDEN_UNCHANGED" \
            "PROFILE_1=PHONE_GAMEPAD_GOLDEN_UNCHANGED" \
            "PROFILE_7=PUBG_TOUCH_V3_STABILITY_CONTROLS" \
            "HOTKEY_TOUCH=F8+F9+7_HOLD_1.5_SECONDS" \
            "TOUCH_VID_PID=CAFE:4018" \
            "SCREENSHOT=1910x864" \
            "ANDROID_NATURAL_TOUCH_SPACE=1080x2388" \
            "CENTER_PROOF_POINTER=540,1194_TO_HID_16384,16384" \
            "PUBG_KEYMAP=SPACE:X,F:680,1630,C:TRIANGLE,E:R1,Q:L1,TAB:SHARE,R,G,SHIFT,WASD:JOYSTICK_DRAG" \
            "PUBG_MOUSE_LEFT=FIRE_ONLY_POINTER_556_2292" \
            "PUBG_MOUSE_RIGHT=POINTER_525_2230" \
            "PUBG_MOUSE_LOOK_BOX_X=303..778" \
            "PUBG_MOUSE_LOOK_BOX_Y=934..1454" \
            "PUBG_MOUSE_LOOK_SPEED=HALF_OF_V5" \
            "ACTIVE_TOUCH_HEARTBEAT=8MS_125HZ" \
            "SHIFT=POINTER_860_1925" \
            "R=POINTER_77_1850" \
            "SCROLL_DOWN=POINTER_100_1050" \
            "SCROLL_UP=POINTER_100_1305" \
            "MIDDLE_CLICK=POINTER_82_1575" \
            "F=POINTER_680_1630" \
            "G=POINTER_90_800" \
            "SCROLL_TOUCH_PULSE=40MS" \
            "PUBG_MOUSE_LOOK_AND_FIRE=INDEPENDENT_CONTACTS" \
            "PUBG_MOVEMENT_CENTER=POINTER_340_466" \
            "PUBG_MOVEMENT=TOUCH_CENTER_THEN_DRAG_SAME_CONTACT_ID" \
            "PUBG_TOUCH_QUEUE=BACKPRESSURE_SAFE_RELEASE_PRESERVING" \
            "PUBG_JUMP=POINTER_343_2230" \
            "PUBG_F=POINTER_680_1630" \
            "PUBG_TRIANGLE_TAP=POINTER_70_2016_50MS" \
            "PUBG_TRIANGLE_HOLD=POINTER_80_2144_AFTER_100MS_FOR_100MS" \
            "PUBG_R1=POINTER_690_510" \
            "PUBG_L1=POINTER_690_350" \
            "PUBG_SHARE=POINTER_100_215" \
            "PUBG_JOYSTICK_UP=POINTER_420_466" \
            "PUBG_JOYSTICK_DOWN=POINTER_210_466" \
            "PUBG_JOYSTICK_LEFT=POINTER_340_380" \
            "PUBG_JOYSTICK_RIGHT=POINTER_340_560" \
            "TOUCH_RELEASE=EXPLICIT_SAME_CONTACT_ID_TIP_CLEAR_LAST_XY" \
            "CONTACT_COUNT=TOTAL_CONTACTS_REPORTED_INCLUDING_RELEASE" \
            > artifacts/BUILD-INFO.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-PUBG-TOUCH-V3-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

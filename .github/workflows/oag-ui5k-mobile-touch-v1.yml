name: OAG UI5K Mobile Touch V1

on:
  push:
    branches:
      - chatgpt/ui5k-mobile-touch-v1
    paths:
      - 'oag/**'
      - '.github/workflows/oag-ui5k-mobile-touch-v1.yml'
  workflow_dispatch:

jobs:
  guard-and-host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify Golden protection and scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="19b84f3c458384f75a44cc394da8269e49e57340"

          test "$(git merge-base "${BASE}" HEAD)" = "${BASE}"
          test "$(git rev-parse origin/golden/ui5k-oag-abo-gemi-ultra-gaming-v1)" = "${BASE}"

          # Critical hardware/input paths from the Golden remain untouched.
          git diff --exit-code "${BASE}" HEAD --             oag/firmware/src/usb_pio_host.cpp             oag/firmware/src/usb_pio_probe.c             oag/firmware/src/xinput_host.cpp             oag/firmware/src/bluetooth_host_v2.cpp             oag/firmware/src/bluetooth_hid_parser_v2.cpp             oag/src/device/usb_device_classifier.cpp             oag/src/protocol/xusb/xusb_input_driver.cpp             oag/src/protocol/xgip/xgip_input_driver.cpp             oag/src/protocol/hid/generic_hid_gamepad_driver.cpp             oag/src/mapping/pass_through_mapping.cpp             oag/src/mapping/keyboard_mouse_gamepad_mapper.cpp

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          base = "19b84f3c458384f75a44cc394da8269e49e57340"

          current_usb = Path("oag/firmware/src/usb_descriptors.cpp").read_text()
          base_usb = subprocess.check_output(
              ["git","show",f"{base}:oag/firmware/src/usb_descriptors.cpp"],
              text=True,
          )

          def array_block(text, name):
              marker = f"const std::uint8_t {name}[] = {{"
              start = text.index(marker)
              end = text.index("\n};", start) + 3
              return text[start:end]

          # Existing hardware-verified PC and Phone descriptor payloads must
          # remain source-identical. Profile 7 is additive.
          for name in [
              "kPcDeviceDescriptor",
              "kPcConfigurationDescriptor",
              "kPcMsOsStringDescriptor",
              "kPcExtendedCompatIdDescriptor",
              "kMobileGamepadReportDescriptor",
              "kMobileKeyboardReportDescriptor",
              "kMobileMouseReportDescriptor",
              "kMobileDeviceDescriptor",
              "kMobileConfigurationDescriptor",
          ]:
              assert array_block(current_usb, name) == array_block(base_usb, name), name

          selector_h = Path("oag/firmware/include/oag/firmware/output_profile_selector.h").read_text()
          selector_cpp = Path("oag/firmware/src/output_profile_selector.cpp").read_text()
          main = Path("oag/firmware/src/main.cpp").read_text()
          touch = Path("oag/firmware/src/mobile_touch_output.cpp").read_text()
          touch_map = Path("oag/src/output/touch/mobile_touch_mapper.cpp").read_text()
          tusb = Path("oag/firmware/tusb_config.h").read_text()

          assert "MobileTouch = 7" in selector_h
          assert "case OutputProfileId::MobileTouch:" in selector_cpp
          assert "mobileTouchUsbProfileActive()" in main
          assert "kProfileDigit7Usage = 0x24" in main
          assert "usage <= kProfileDigit7Usage" in main

          assert "kMobileTouchDevicePid = 0x4018" in current_usb
          assert "kMobileTouchContactCount = 10" in current_usb
          assert "Usage (Touch Screen)" in current_usb
          assert "Usage (Contact Identifier)" in current_usb
          assert "Usage (Contact Count)" in current_usb
          assert "Usage (Contact Count Maximum)" in current_usb

          assert "sizeof(Report) == 61" in Path(
              "oag/firmware/include/oag/firmware/mobile_touch_output.h"
          ).read_text()
          assert "logicalSlot != 0" in touch
          assert "Tip Switch + In Range" in touch

          assert "ButtonSouth" in touch_map
          assert "ButtonEast" in touch_map
          assert "ButtonWest" in touch_map
          assert "ButtonNorth" in touch_map
          assert "ButtonLeftBumper" in touch_map
          assert "ButtonRightBumper" in touch_map
          assert "ButtonStart" in touch_map
          assert "ButtonBack" in touch_map

          assert "#define CFG_TUD_ENDPOINT0_SIZE 8" in tusb
          assert "#define CFG_TUD_HID 6" in tusb
          assert "#define CFG_TUD_HID_EP_BUFSIZE 64" in tusb

          # Branding and existing identities remain locked.
          assert 'return "OAG ABO GEMI ULTRA GAMING";' in current_usb
          assert "kPcReceiverPid = 0x4016" in current_usb
          assert "kMobileDevicePid = 0x4017" in current_usb

          print("MOBILE_TOUCH_SCOPE_GUARD=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Build and run all host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host             -DCMAKE_BUILD_TYPE=Release             -DOAG_BUILD_HOST_TESTS=ON
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware:
    needs: guard-and-host-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Golden Pico SDK
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-ui5k rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-ui5k/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-ui5k/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-ui5k" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Build Pico 2 W candidate
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-ui5k"           cmake -S oag/firmware -B build/oag-fw             -DCMAKE_BUILD_TYPE=Release             -DPICO_BOARD=pico2_w             -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2 < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2[@]}" -eq 1
          test "${#ELF[@]}" -eq 1
          test "${#MAP[@]}" -eq 1

          SHORT_SHA="${GITHUB_SHA::8}"

          cp "${UF2[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_V1_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_V1_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_V1_${SHORT_SHA}_Pico2W.map"

          sha256sum artifacts/OAG_UI5K_MOBILE_TOUCH_V1_* > artifacts/SHA256SUMS.txt

          printf '%s\n'             "GOLDEN_BASE=19b84f3c458384f75a44cc394da8269e49e57340"             "PROFILE_0=PC_GOLDEN_UNCHANGED"             "PROFILE_1=PHONE_GAMEPAD_GOLDEN_UNCHANGED"             "PROFILE_7=MOBILE_MULTITOUCH_EXPERIMENTAL"             "HOTKEY_TOUCH=F8+F9+7_HOLD_1.5_SECONDS"             "TOUCH_PID=CAFE:4018"             "MAX_TOUCH_CONTACTS=10"             "TOUCH_COORDINATES=NORMALIZED_0_TO_32767"             > artifacts/BUILD-INFO.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-UI5K-MOBILE-TOUCH-V1-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

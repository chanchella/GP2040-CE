name: OAG UI5K Generic HID Family V1

on:
  push:
    branches:
      - chatgpt/ui5k-generic-hid-family-v1
    paths:
      - 'oag/include/oag/protocol/hid/generic_hid_gamepad_driver.h'
      - 'oag/src/protocol/hid/generic_hid_gamepad_driver.cpp'
      - 'oag/tests/host/test_generic_hid_gamepad.cpp'
      - '.github/workflows/oag-ui5k-generic-hid-family-v1.yml'
  workflow_dispatch:

jobs:
  guard-and-host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify protected baselines and isolated input scope
        shell: bash
        run: |
          set -euo pipefail

          BASE="5a1cee019bcad6b6329bf52ed0e24a743c372a7b"
          UI5K="01af260742a6a402a851cceef0707ae69bd6a301"
          PHONE_V3="2429dff3877204112b520cdc51941c489b2eecbb"

          test "${GITHUB_REF_NAME}" = "chatgpt/ui5k-generic-hid-family-v1"
          test "$(git merge-base "${BASE}" HEAD)" = "${BASE}"

          # The protected references must remain exactly where the user
          # hardware-validated them.
          test "$(git rev-parse origin/golden/ui5k-multiprofile-pc-phone-hw)" = "${BASE}"
          test "$(git rev-parse "${UI5K}")" = "${UI5K}"
          test "$(git rev-parse origin/golden/ui5k-mobile-otg-v3-hw)" = "${PHONE_V3}"

          ACTUAL="$(git diff --name-only "${BASE}" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/oag-ui5k-generic-hid-family-v1.yml' \
            'oag/include/oag/protocol/hid/generic_hid_gamepad_driver.h' \
            'oag/src/protocol/hid/generic_hid_gamepad_driver.cpp' \
            'oag/tests/host/test_generic_hid_gamepad.cpp' | sort)"

          echo "=== GENERIC_HID_FAMILY_SCOPE ==="
          printf '%s\n' "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

          # Hard lock everything that made PC/Phone/keyboard/mouse/hotkeys pass.
          git diff --exit-code "${BASE}" HEAD -- \
            oag/firmware/src/main.cpp \
            oag/firmware/src/usb_descriptors.cpp \
            oag/firmware/tusb_config.h \
            oag/firmware/src/output_profile_selector.cpp \
            oag/firmware/src/multi_profile_platform_driver.cpp \
            oag/firmware/src/pc_hid_output.cpp \
            oag/firmware/src/pc_xinput_device.cpp \
            oag/firmware/src/pc_native_km_output.cpp \
            oag/firmware/src/bluetooth_host_v2.cpp \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/xinput_host.cpp

          python3 - <<'PY'
          from pathlib import Path

          h = Path("oag/include/oag/protocol/hid/generic_hid_gamepad_driver.h").read_text()
          cpp = Path("oag/src/protocol/hid/generic_hid_gamepad_driver.cpp").read_text()
          test = Path("oag/tests/host/test_generic_hid_gamepad.cpp").read_text()

          assert "DragonRiseTwinShockFamily" in h
          assert "dragonRiseTwinShockFamilySignature" in cpp

          # Family detection must be structural, not tied to one VID/PID.
          assert "0x0079" not in cpp
          assert "0x0006" not in cpp
          assert "buttonCount == 12" in cpp
          assert "eightBitAxisCount == 5" in cpp
          assert "vendorOneBitFieldCount >= 8" in cpp
          assert "buttonMask == 0x0FFFu" in cpp

          # Exact face normalization derived from the hardware observation:
          # raw 1=N, 2=E, 3=S, 4=W; 5..12 stay on existing legacy path.
          assert "case 1: state.buttons |= ButtonNorth; return;" in cpp
          assert "case 2: state.buttons |= ButtonEast; return;" in cpp
          assert "case 3: state.buttons |= ButtonSouth; return;" in cpp
          assert "case 4: state.buttons |= ButtonWest; return;" in cpp

          assert "twinShockFamilyDescriptor" in test
          assert "twinShockSouth" in test
          assert "twinShockNorth" in test
          assert "twinShockWest" in test
          assert "twinShockEast" in test

          print("GENERIC_HID_FAMILY_GUARD=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Configure host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DOAG_BUILD_HOST_TESTS=ON

      - name: Build and run host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware:
    needs: guard-and-host-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact UI5K Pico SDK generation
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned SDK generation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-ui5k rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          test "$(git -C pico-sdk-ui5k/lib/btstack rev-parse HEAD)" = "075a0780f0fad7ff67d58ac19f46e8953656a752"
          test "$(git -C pico-sdk-ui5k/lib/cyw43-driver rev-parse HEAD)" = "055d64274b014dd7b1c2fc94d26e8a18face7124"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-ui5k" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Configure and build Pico 2 W firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-ui5k" \
          cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2_w \
            -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2 < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2[@]}" -eq 1
          test "${#ELF[@]}" -eq 1
          test "${#MAP[@]}" -eq 1

          SHORT_SHA="${GITHUB_SHA::8}"

          cp "${UF2[0]}" \
            "artifacts/OAG_UI5K_GENERIC_HID_FAMILY_V1_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF[0]}" \
            "artifacts/OAG_UI5K_GENERIC_HID_FAMILY_V1_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP[0]}" \
            "artifacts/OAG_UI5K_GENERIC_HID_FAMILY_V1_${SHORT_SHA}_Pico2W.map"

          arm-none-eabi-size "${ELF[0]}" | tee artifacts/size-report.txt
          sha256sum artifacts/OAG_UI5K_GENERIC_HID_FAMILY_V1_* \
            > artifacts/SHA256SUMS.txt

          printf '%s\n' \
            "MULTIPROFILE_HW_BASE=5a1cee019bcad6b6329bf52ed0e24a743c372a7b" \
            "UI5K_GOLDEN=01af260742a6a402a851cceef0707ae69bd6a301" \
            "PHONE_V3_HW=2429dff3877204112b520cdc51941c489b2eecbb" \
            "CHANGE_SCOPE=GENERIC_HID_INPUT_NORMALIZATION_ONLY" \
            "FAMILY_MATCH=STRUCTURAL_NOT_VID_PID" \
            > artifacts/BUILD-INFO.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-UI5K-GENERIC-HID-FAMILY-V1-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

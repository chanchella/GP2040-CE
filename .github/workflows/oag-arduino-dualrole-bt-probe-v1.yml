name: OAG Arduino Dual-Role Bluetooth Probe V1

on:
  push:
    branches:
      - chatgpt/arduino-dualrole-bt-probe-v1
    paths:
      - 'oag/standalone/arduino_dualrole_bt_probe/**'
      - '.github/workflows/oag-arduino-dualrole-bt-probe-v1.yml'
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify exact UI5K Golden ancestry and isolated scope
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN="01af260742a6a402a851cceef0707ae69bd6a301"
          test "${GITHUB_REF_NAME}" = "chatgpt/arduino-dualrole-bt-probe-v1"
          test "$(git merge-base "${GOLDEN}" HEAD)" = "${GOLDEN}"

          ACTUAL="$(git diff --name-only "${GOLDEN}" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/oag-arduino-dualrole-bt-probe-v1.yml' \
            'oag/standalone/arduino_dualrole_bt_probe/arduino_dualrole_bt_probe.ino' | sort)"

          printf '%s\n' "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

          git diff --exit-code "${GOLDEN}" HEAD -- \
            oag/firmware \
            oag/include \
            oag/src \
            oag/tests \
            oag/tools

          echo "UI5K_RUNTIME_UNTOUCHED=PASS"

  build:
    needs: guard
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install exact Arduino-Pico 6.1.1
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@6.1.1

          arduino-cli core list
          arduino-cli board listall | grep -F "rp2040:rp2040:rpipico2w"

      - name: Compile Pico 2 W dual-role Bluetooth probe
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/arduino-dualrole-bt
          mkdir -p build/arduino-dualrole-bt

          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico2w:ipbtstack=ipv4btcble \
            --output-dir build/arduino-dualrole-bt \
            oag/standalone/arduino_dualrole_bt_probe

          mapfile -t UF2 < <(
            find build/arduino-dualrole-bt -maxdepth 1 -type f -name '*.uf2' -print
          )

          test "${#UF2[@]}" -eq 1

          mkdir -p artifacts
          SHORT_SHA="${GITHUB_SHA::8}"

          cp "${UF2[0]}" \
            "artifacts/OAG_ARDUINO_DUALROLE_BT_PROBE_V1_${SHORT_SHA}_Pico2W.uf2"

          sha256sum \
            "artifacts/OAG_ARDUINO_DUALROLE_BT_PROBE_V1_${SHORT_SHA}_Pico2W.uf2" \
            | tee artifacts/SHA256SUMS.txt

          printf '%s\n' \
            "BASELINE=01af260742a6a402a851cceef0707ae69bd6a301" \
            "ARDUINO_PICO=6.1.1" \
            "FQBN=rp2040:rp2040:rpipico2w:ipbtstack=ipv4btcble" \
            "OUTPUT_NAME=OAG DUALROLE BT PROBE" \
            "FLOW=Windows HIDS Device -> controller HIDS Host -> live JoystickBLE bridge" \
            > artifacts/BUILD-INFO.txt

      - name: Upload dual-role probe
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-ARDUINO-DUALROLE-BT-PROBE-V1-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

name: OAG Mobile Touch Engine V1

on:
  push:
    branches:
      - chatgpt/oag-mobile-touch-engine-v1
  workflow_dispatch:

jobs:
  guard-and-host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Protect diamond baseline and constrain scope
        shell: bash
        run: |
          set -euo pipefail
          GOLDEN="19b84f3c458384f75a44cc394da8269e49e57340"
          test "$(git rev-parse origin/golden/ui5k-oag-abo-gemi-ultra-gaming-v1)" = "${GOLDEN}"
          test "$(git merge-base "${GOLDEN}" HEAD)" = "${GOLDEN}"

          ALLOWED='^(\.github/workflows/oag-mobile-touch-engine-v1\.yml|oag/CMakeLists\.txt|oag/firmware/CMakeLists\.txt|oag/firmware/include/oag/firmware/(mobile_touch_output|mobile_touch_platform_driver|multi_profile_platform_driver|output_profile_selector)\.h|oag/firmware/src/(main|mobile_touch_output|mobile_touch_platform_driver|multi_profile_platform_driver|output_profile_selector|pc_hid_output|usb_descriptors)\.cpp|oag/firmware/tusb_config\.h|oag/include/oag/output/touch/mobile_touch_mapper\.h|oag/src/output/touch/mobile_touch_mapper\.cpp|oag/tests/host/test_mobile_touch_mapper\.cpp)$'
          while IFS= read -r file; do
            echo "TOUCH_SCOPE: ${file}"
            [[ "${file}" =~ ${ALLOWED} ]] || { echo "OUT_OF_SCOPE=${file}"; exit 1; }
          done < <(git diff --name-only "${GOLDEN}" HEAD)

          python3 - <<'PY'
          from pathlib import Path
          h = Path('oag/firmware/include/oag/firmware/mobile_touch_output.h').read_text()
          cpp = Path('oag/firmware/src/mobile_touch_output.cpp').read_text()
          main = Path('oag/firmware/src/main.cpp').read_text()
          desc = Path('oag/firmware/src/usb_descriptors.cpp').read_text()
          selector = Path('oag/firmware/src/output_profile_selector.cpp').read_text()
          for token in ['kTransferTimeoutUs = 250000', 'reportPending_', 'LinkRecoveryPhase']:
              assert token in h, token
          for token in ['tud_hid_report_complete_cb', 'beginLinkRecovery', 'tud_disconnect()', 'tud_connect()', 'commitCompletedSnapshot(time_us_64())']:
              assert token in cpp, token
          for token in ['kProfileDigit7Usage', 'mobileTouchUsbProfileActive()', 'servicePubgTouchMaintenance']:
              assert token in main, token
          assert 'OutputProfileId::MobileTouch' in selector
          assert 'kMobileTouchReportDescriptor' in desc
          assert 'kMobileTouchDevicePid = 0x4019' in desc
          print('MOBILE_TOUCH_V1_GUARD=PASS')
          PY

      - name: Architecture dependency guard
        run: python3 oag/tools/check_architecture.py

      - name: Configure host tests
        run: cmake -S oag -B build/oag-host -DCMAKE_BUILD_TYPE=Release -DOAG_BUILD_HOST_TESTS=ON

      - name: Build and run host tests
        run: |
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware:
    needs: guard-and-host-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Golden Pico SDK
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-ui5k rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-ui5k" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Build Pico 2 W candidate
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-ui5k" cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2_w -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t UF2 < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          test "${#UF2[@]}" -eq 1
          cp "${UF2[0]}" artifacts/OAG_MOBILE_TOUCH_ENGINE_V1_Pico2W.uf2
          sha256sum artifacts/OAG_MOBILE_TOUCH_ENGINE_V1_Pico2W.uf2 | tee artifacts/SHA256SUMS.txt
          printf '%s\n' \
            "GOLDEN_BASE=19b84f3c458384f75a44cc394da8269e49e57340" \
            "BRANCH=chatgpt/oag-mobile-touch-engine-v1" \
            "TOUCH_MODE=F8+F9+7" \
            "PC_MODE=F8+F9+0" \
            "PHONE_GAMEPAD_MODE=F8+F9+1" \
            "TRANSPORT=COMPLETION_AWARE_WITH_SOFT_RECONNECT" \
            > artifacts/BUILD-INFO.txt

      - name: Upload UF2
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-MOBILE-TOUCH-ENGINE-V1-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

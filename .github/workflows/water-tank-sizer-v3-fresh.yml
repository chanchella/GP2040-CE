name: Build Water Tank Sizer V7

on:
  push:
    branches: [ water-tank-sizer-v7 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: water-tank-sizer-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build fresh debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Water-Tank-Sizer-V7
          path: water-tank-sizer-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

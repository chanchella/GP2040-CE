name: OAG Weapon Tuning Experimental V1

on:
  push:
    branches:
      - chatgpt/oag-weapon-tuning-v1
    paths:
      - '.github/workflows/oag-weapon-tuning-v1.yml'

jobs:
  build-experimental-copy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout RS8 V2 stock
        uses: actions/checkout@v4.1.1
        with:
          ref: d04d96f514a81d83ee92a994c24ad4389d80b794
          fetch-depth: 1
          submodules: recursive

      - name: Apply Weapon Tuning V1 patch to copy
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/oag_weapon_tuning_v1.patch.gz.b64 <<'PATCH64'

PATCH64
          base64 -d /tmp/oag_weapon_tuning_v1.patch.gz.b64 > /tmp/oag_weapon_tuning_v1.patch.gz
          gzip -dc /tmp/oag_weapon_tuning_v1.patch.gz > /tmp/oag_weapon_tuning_v1.patch
          git apply --check /tmp/oag_weapon_tuning_v1.patch
          git apply /tmp/oag_weapon_tuning_v1.patch

      - name: Architecture and web guards
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py
          node oag/tools/test_combo_editor.js
          node oag/tools/test_weapon_tuning.js

      - name: Host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host -DCMAKE_BUILD_TYPE=Release -DOAG_BUILD_HOST_TESTS=ON
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout pinned Pico SDK
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk-ui5k" >> "$GITHUB_ENV"
          python3 oag/tools/prepare_dependencies.py

      - name: Build Pico 2 W experimental firmware
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="$GITHUB_WORKSPACE/pico-sdk-ui5k" cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2_w -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package experimental copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          UF2="$(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print -quit)"
          test -n "$UF2"
          cp "$UF2" artifacts/OAG_DIAMOND_RS8_V2_WEAPON_TUNING_EXPERIMENTAL_V1_Pico2W.uf2
          cp /tmp/oag_weapon_tuning_v1.patch artifacts/OAG_WEAPON_TUNING_V1_SOURCE.patch
          sha256sum artifacts/*.uf2 > artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-DIAMOND-RS8-V2-WEAPON-TUNING-EXPERIMENTAL-V1
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90

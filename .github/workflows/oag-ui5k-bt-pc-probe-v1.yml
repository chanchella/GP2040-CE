name: OAG UI5K Bluetooth PC Probe V1

on:
  push:
    branches:
      - chatgpt/ui5k-bt-pc-probe-v1
    paths:
      - 'oag/standalone/bt_pc_probe/**'
      - '.github/workflows/oag-ui5k-bt-pc-probe-v1.yml'
  workflow_dispatch:

jobs:
  ancestry-and-scope:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify exact UI5K Golden ancestry
        shell: bash
        run: |
          set -euo pipefail

          GOLDEN="01af260742a6a402a851cceef0707ae69bd6a301"

          test "${GITHUB_REF_NAME}" = "chatgpt/ui5k-bt-pc-probe-v1"
          test "$(git merge-base "${GOLDEN}" HEAD)" = "${GOLDEN}"

          ACTUAL="$(git diff --name-only "${GOLDEN}" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/oag-ui5k-bt-pc-probe-v1.yml' \
            'oag/standalone/bt_pc_probe/bt_pc_probe.ino' | sort)"

          echo "=== CANDIDATE_SCOPE ==="
          printf '%s\n' "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

          # Absolute protection gate: the complete UI5K runtime remains
          # byte-identical to the Golden commit.
          git diff --exit-code "${GOLDEN}" HEAD -- \
            oag/firmware \
            oag/include \
            oag/src \
            oag/tests \
            oag/tools

          echo "UI5K_RUNTIME_UNTOUCHED=PASS"

  build-arduino-pico-611:
    needs: ancestry-and-scope
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install exact Arduino-Pico 6.1.1
        shell: bash
        run: |
          set -euo pipefail

          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json

          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040@6.1.1

          arduino-cli core list

          arduino-cli board listall | grep -F "rp2040:rp2040:rpipico2w"

      - name: Compile Pico 2 W BLE gamepad probe
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build/bt-pc-probe
          mkdir -p build/bt-pc-probe

          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico2w,ipbtstack=ipv4btcble \
            --output-dir build/bt-pc-probe \
            oag/standalone/bt_pc_probe

          mapfile -t UF2 < <(
            find build/bt-pc-probe -maxdepth 1 -type f -name '*.uf2' -print
          )

          test "${#UF2[@]}" -eq 1

          mkdir -p artifacts
          SHORT_SHA="${GITHUB_SHA::8}"

          cp "${UF2[0]}" \
            "artifacts/OAG_UI5K_BT_PC_PROBE_V1_${SHORT_SHA}_Pico2W.uf2"

          sha256sum \
            "artifacts/OAG_UI5K_BT_PC_PROBE_V1_${SHORT_SHA}_Pico2W.uf2" \
            | tee artifacts/SHA256SUMS.txt

          printf '%s\n' \
            "BASELINE=01af260742a6a402a851cceef0707ae69bd6a301" \
            "ARDUINO_PICO=6.1.1" \
            "FQBN=rp2040:rp2040:rpipico2w,ipbtstack=ipv4btcble" \
            "BLUETOOTH_NAME=OAG PC BLE GAMEPAD" \
            > artifacts/BUILD-INFO.txt

      - name: Upload Bluetooth PC probe
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-UI5K-BT-PC-PROBE-V1-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

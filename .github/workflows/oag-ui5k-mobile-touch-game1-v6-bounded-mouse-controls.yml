name: OAG UI5K Mobile Touch Game1 V6 Bounded Mouse Controls

on:
  push:
    branches:
      - chatgpt/ui5k-mobile-touch-game1-v6-bounded-mouse-controls
    paths:
      - 'oag/firmware/src/main.cpp'
      - 'oag/include/oag/output/touch/mobile_touch_mapper.h'
      - 'oag/src/output/touch/mobile_touch_mapper.cpp'
      - 'oag/tests/host/test_mobile_touch_mapper.cpp'
      - '.github/workflows/oag-ui5k-mobile-touch-game1-v6-bounded-mouse-controls.yml'
  workflow_dispatch:

jobs:
  guard-and-host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify isolated Game 1 V6 bounded-controls scope
        shell: bash
        run: |
          set -euo pipefail

          GOLDEN="19b84f3c458384f75a44cc394da8269e49e57340"
          TOUCH_BASE="5a087b4d062e7a123109d5d8d6abb6d32ec9e154"
          GAME1_V3_BASE="17eb3105147191e4aa01bc8b630d5c59999d115f"
          GAME1_V4_BASE="9e399f8ca6410bd0cb88f76c69d5bba8ce1b9d69"
          GAME1_V5_BASE="85d8ea8bf4e7b040a27b283a38b04df4d79987e5"

          test "$(git merge-base "${TOUCH_BASE}" HEAD)" = "${TOUCH_BASE}"
          test "$(git rev-parse origin/golden/ui5k-oag-abo-gemi-ultra-gaming-v1)" = "${GOLDEN}"

          ACTUAL="$(git diff --name-only "${GAME1_V5_BASE}" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/oag-ui5k-mobile-touch-game1-v6-bounded-mouse-controls.yml' \
            'oag/firmware/src/main.cpp' \
            'oag/include/oag/output/touch/mobile_touch_mapper.h' \
            'oag/src/output/touch/mobile_touch_mapper.cpp' \
            'oag/tests/host/test_mobile_touch_mapper.cpp' | sort)"

          echo "=== GAME1 V6 BOUNDED-CONTROLS CHANGE SCOPE ==="
          printf '%s\n' "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

          # V4 contact-release lifecycle and all unrelated proven paths remain unchanged.
          git diff --exit-code "${GAME1_V5_BASE}" HEAD -- \
            oag/firmware/include/oag/firmware/mobile_touch_output.h \
            oag/firmware/src/mobile_touch_output.cpp \
            oag/firmware/src/usb_descriptors.cpp \
            oag/firmware/tusb_config.h \
            oag/firmware/src/mobile_touch_platform_driver.cpp \
            oag/firmware/src/multi_profile_platform_driver.cpp \
            oag/firmware/src/output_profile_selector.cpp \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/xinput_host.cpp \
            oag/firmware/src/bluetooth_host_v2.cpp \
            oag/src/protocol/hid/generic_hid_gamepad_driver.cpp

          python3 - <<'PY'
          from pathlib import Path

          m = Path("oag/src/output/touch/mobile_touch_mapper.cpp").read_text()
          t = Path("oag/tests/host/test_mobile_touch_mapper.cpp").read_text()
          out_h = Path("oag/firmware/include/oag/firmware/mobile_touch_output.h").read_text()
          out_cpp = Path("oag/firmware/src/mobile_touch_output.cpp").read_text()
          mapper_h = Path("oag/include/oag/output/touch/mobile_touch_mapper.h").read_text()
          main = Path("oag/firmware/src/main.cpp").read_text()

          for token in [
              "kMoveLeftX = 6796",
              "kMoveRightX = 6341",
              "kR3X = 6614",
              "kR2X = 13805",
              "kSquareX = 6372",
              "kCrossX = 10407",
              "kCrossY = 30600",
              "kMouseLeftX = 16869",
              "kMouseLeftY = 31451",
              "kTriangleShortX = 2124",
              "kTriangleShortY = 27663",
              "kTriangleHoldX = 2427",
              "kTriangleHoldY = 29420",
              "kShareX = 3034",
              "kShareY = 2950",
              "kR1X = 20935",
              "kR1Y = 6998",
              "kL1X = 20935",
              "kL1Y = 4803",
              "kDpadUpX = 12743",
              "kDpadDownX = 6372",
              "kDpadLeftX = 10316",
              "kDpadRightY = 7684",
              "kLookCenterX = 11302",
              "kLookCenterY = 26072",
              "kLookMinX = 4096",
              "kLookMaxX = 18508",
              "kLookMinY = 22504",
              "kLookMaxY = 29639",
              "kLookMaxHorizontalStep = 984",
              "kLookMaxVerticalStep = 2184",
          ]:
              assert token in m, token

          for token in [
              "kMobileTouchMouseLeftButton = 1ull << 63",
              "kMobileTouchTriangleShortButton = 1ull << 62",
              "kMobileTouchTriangleHoldButton = 1ull << 61",
              "kMobileTouchMouseLookHoldButton = 1ull << 60",
              "lookTouchX_ = 11302",
              "lookTouchY_ = 26072",
          ]:
              assert token in mapper_h, token

          for token in [
              "assertPoint(look1, 4, 11302, 27056)",
              "assertPoint(look2, 4, 11302, 28040)",
              "assertPoint(look3, 4, 11302, 29024)",
              "assertPoint(edgeRestart, 4, 11302, 27056)",
              "assertPoint(mapper.map(mouseLeft), 5, 16869, 31451)",
              "assertPoint(mapper.map(triShort), 6, 2124, 27663)",
              "assertPoint(mapper.map(triHold), 7, 2427, 29420)",
              "assertPoint(mapper.map(r1), 9, 20935, 6998)",
              "assertPoint(mapper.map(l1), 10, 20935, 4803)",
              "assert(allFrame.count == 5)",
          ]:
              assert token in t, token

          for token in [
              "applyTouchTriangleGesture",
              "kTouchTriangleShortPulseUs = 50000",
              "kTouchTriangleHoldThresholdUs = 100000",
              "kTouchTriangleHoldPulseUs = 100000",
              "kMobileTouchMouseLeftButton",
              "kMobileTouchMouseLookHoldButton",
              "mouseForMapping.buttons",
              "updateMouseAimFromCurrentMotion",
              "serviceTouchTriangleTiming",
              "currentMouseMotion_ = {}",
          ]:
              assert token in main, token

          # V4 explicit contact-up lifecycle must remain intact.
          for token in ["previousFrame_"]:
              assert token in out_h, token

          for token in [
              "findContactById",
              "explicit UP",
              "next.contactCount = reportedContacts",
              "previousFrame_ = frame",
              "previousFrame_ = {}",
          ]:
              assert token in out_cpp, token

          print("GAME1_V6_BOUNDED_CONTROLS_GUARD=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Build and run all host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host             -DCMAKE_BUILD_TYPE=Release             -DOAG_BUILD_HOST_TESTS=ON
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware:
    needs: guard-and-host-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Golden Pico SDK
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-ui5k rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-ui5k" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Build Pico 2 W candidate
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-ui5k"           cmake -S oag/firmware -B build/oag-fw             -DCMAKE_BUILD_TYPE=Release             -DPICO_BOARD=pico2_w             -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2 < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2[@]}" -eq 1
          test "${#ELF[@]}" -eq 1
          test "${#MAP[@]}" -eq 1

          SHORT_SHA="${GITHUB_SHA::8}"
          cp "${UF2[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_GAME1_V6_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_GAME1_V6_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_GAME1_V6_${SHORT_SHA}_Pico2W.map"

          sha256sum artifacts/OAG_UI5K_MOBILE_TOUCH_GAME1_V6_* > artifacts/SHA256SUMS.txt

          printf '%s\n' \
            "GOLDEN_BASE=19b84f3c458384f75a44cc394da8269e49e57340" \
            "TOUCH_BASE=5a087b4d062e7a123109d5d8d6abb6d32ec9e154" \
            "PROFILE_0=PC_GOLDEN_UNCHANGED" \
            "PROFILE_1=PHONE_GAMEPAD_GOLDEN_UNCHANGED" \
            "PROFILE_7=GAME1_V6_BOUNDED_MOUSE_AND_MEASURED_CONTROLS" \
            "HOTKEY_TOUCH=F8+F9+7_HOLD_1.5_SECONDS" \
            "TOUCH_VID_PID=CAFE:4018" \
            "SCREENSHOT=1910x864" \
            "ANDROID_NATURAL_TOUCH_SPACE=1080x2388" \
            "CENTER_PROOF_POINTER=540,1194_TO_HID_16384,16384" \
            "MOVE_LEFT_ANALOG=6796,3527" \
            "MOVE_RIGHT_ANALOG=6341,9358" \
            "R3=6614,6243" \
            "R2=13805,28404" \
            "CROSS_JUMP=10407,30600" \
            "SQUARE=6372,28542" \
            "MOUSE_LEFT=16869,31451" \
            "TRIANGLE_SHORT_50MS=2124,27663" \
            "TRIANGLE_HOLD_THRESHOLD_100MS_THEN_100MS=2427,29420" \
            "SHARE=3034,2950" \
            "R1=20935,6998" \
            "L1=20935,4803" \
            "DPAD_UP=12743,6394" \
            "DPAD_DOWN=6372,6394" \
            "DPAD_LEFT=10316,5214" \
            "DPAD_RIGHT=10316,7684" \
            "KEYBOARD_A_D=LEFT_RIGHT_VIA_LEFT_STICK" \
            "SPACE=CROSS_JUMP" \
            "Q=SQUARE" \
            "R=TRIANGLE_TIMED" \
            "TAB=SHARE_LEGACY_BACK" \
            "F=R1" \
            "MOUSE_MIDDLE=R3_VIA_RIGHT_STICK_CLICK" \
            "TOUCH_RELEASE=EXPLICIT_SAME_CONTACT_ID_TIP_CLEAR_LAST_XY" \
            "CONTACT_COUNT=TOTAL_CONTACTS_REPORTED_INCLUDING_RELEASE" \
            "MOUSE_LOOK=RELATIVE_TOUCH_CONTACT_ID_4" \
            "MOUSE_LOOK_POINTER_BOX_X=135..610" \
            "MOUSE_LOOK_POINTER_BOX_Y=1640..2160" \
            "MOUSE_LOOK_HID_BOX_X=4096..18508" \
            "MOUSE_LOOK_HID_BOX_Y=22504..29639" \
            "MOUSE_LOOK_RAW_CLAMP=48_COUNTS" \
            "MOUSE_LOOK_SPEED=HALF_OF_V5_APPROX_1.5_SCREEN_PIXELS_PER_COUNT" \
            "MOUSE_LOOK_REANCHOR=CLEAN_RELEASE_AT_BOX_EDGE" \
            > artifacts/BUILD-INFO.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-UI5K-MOBILE-TOUCH-GAME1-V6-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

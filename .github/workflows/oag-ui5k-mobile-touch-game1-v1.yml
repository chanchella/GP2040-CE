name: OAG UI5K Mobile Touch Game1 V1

on:
  push:
    branches:
      - chatgpt/ui5k-mobile-touch-game1-v1
    paths:
      - 'oag/src/output/touch/mobile_touch_mapper.cpp'
      - 'oag/tests/host/test_mobile_touch_mapper.cpp'
      - '.github/workflows/oag-ui5k-mobile-touch-game1-v1.yml'
  workflow_dispatch:

jobs:
  guard-and-host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify isolated Game 1 scope
        shell: bash
        run: |
          set -euo pipefail

          GOLDEN="19b84f3c458384f75a44cc394da8269e49e57340"
          TOUCH_BASE="5a087b4d062e7a123109d5d8d6abb6d32ec9e154"

          test "$(git merge-base "${TOUCH_BASE}" HEAD)" = "${TOUCH_BASE}"
          test "$(git rev-parse origin/golden/ui5k-oag-abo-gemi-ultra-gaming-v1)" = "${GOLDEN}"

          ACTUAL="$(git diff --name-only "${TOUCH_BASE}" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/oag-ui5k-mobile-touch-game1-v1.yml' \
            'oag/src/output/touch/mobile_touch_mapper.cpp' \
            'oag/tests/host/test_mobile_touch_mapper.cpp' | sort)"

          echo "=== GAME1 CHANGE SCOPE ==="
          printf '%s\n' "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

          # Touch transport and all proven Golden paths remain untouched.
          git diff --exit-code "${TOUCH_BASE}" HEAD --             oag/firmware/src/usb_descriptors.cpp             oag/firmware/tusb_config.h             oag/firmware/src/main.cpp             oag/firmware/src/mobile_touch_output.cpp             oag/firmware/src/mobile_touch_platform_driver.cpp             oag/firmware/src/multi_profile_platform_driver.cpp             oag/firmware/src/output_profile_selector.cpp             oag/firmware/src/usb_pio_host.cpp             oag/firmware/src/xinput_host.cpp             oag/firmware/src/bluetooth_host_v2.cpp             oag/src/protocol/hid/generic_hid_gamepad_driver.cpp

          python3 - <<'PY'
          from pathlib import Path

          m = Path("oag/src/output/touch/mobile_touch_mapper.cpp").read_text()
          t = Path("oag/tests/host/test_mobile_touch_mapper.cpp").read_text()

          for token in [
              "kMoveLeftX = 3139",
              "kMoveLeftY = 25903",
              "kMoveCenterX = 6107",
              "kMoveCenterY = 25827",
              "kMoveRightX = 8681",
              "kMoveRightY = 25941",
              "kCrossAttackX = 28547",
              "kCrossAttackY = 26775",
              "ButtonRightStick",
              "ButtonSouth",
              "state.rightTrigger > kTriggerThreshold",
          ]:
              assert token in m, token

          for token in [
              "assertPoint(leftFrame, 0, 3139, 25903)",
              "assertPoint(rightFrame, 0, 8681, 25941)",
              "assertPoint(r3Frame, 0, 6107, 25827)",
              "assertPoint(crossFrame, 1, 28547, 26775)",
              "assert(comboFrame.count == 2)",
          ]:
              assert token in t, token

          print("GAME1_CALIBRATION_GUARD=PASS")
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Build and run all host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host             -DCMAKE_BUILD_TYPE=Release             -DOAG_BUILD_HOST_TESTS=ON
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware:
    needs: guard-and-host-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Golden Pico SDK
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-ui5k rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-ui5k" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Build Pico 2 W candidate
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-ui5k"           cmake -S oag/firmware -B build/oag-fw             -DCMAKE_BUILD_TYPE=Release             -DPICO_BOARD=pico2_w             -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2 < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2[@]}" -eq 1
          test "${#ELF[@]}" -eq 1
          test "${#MAP[@]}" -eq 1

          SHORT_SHA="${GITHUB_SHA::8}"
          cp "${UF2[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_GAME1_V1_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_GAME1_V1_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP[0]}" "artifacts/OAG_UI5K_MOBILE_TOUCH_GAME1_V1_${SHORT_SHA}_Pico2W.map"

          sha256sum artifacts/OAG_UI5K_MOBILE_TOUCH_GAME1_V1_* > artifacts/SHA256SUMS.txt

          printf '%s\n'             "GOLDEN_BASE=19b84f3c458384f75a44cc394da8269e49e57340"             "TOUCH_BASE=5a087b4d062e7a123109d5d8d6abb6d32ec9e154"             "PROFILE_7=GAME1_SCREENSHOT_CALIBRATED"             "SCREENSHOT=1910x864"             "PHONE_LANDSCAPE=2388x1080"             "DPAD_LEFT=3139,25903"             "R3=6107,25827"             "DPAD_RIGHT=8681,25941"             "CROSS_ATTACK=28547,26775"             "KEYBOARD_A_D=LEFT_RIGHT_VIA_LEFT_STICK"             "SPACE=CROSS_ATTACK"             "MOUSE_LEFT=ATTACK_VIA_RT"             > artifacts/BUILD-INFO.txt

      - name: Upload candidate
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-UI5K-MOBILE-TOUCH-GAME1-V1-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

name: OAG PUBG Touch V5 Authoritative Snapshot Recovery

on:
  push:
    branches:
      - chatgpt/pubg-touch-v4-sticky-finger-recovery
    paths:
      - 'oag/firmware/include/oag/firmware/mobile_touch_output.h'
      - 'oag/firmware/src/mobile_touch_output.cpp'
      - '.github/workflows/oag-pubg-touch-v5-authoritative-snapshot.yml'
      - '.github/workflows/oag-pubg-touch-v4-sticky-finger-recovery.yml'
  workflow_dispatch:

jobs:
  guard-and-host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Verify isolated V5 scope
        shell: bash
        run: |
          set -euo pipefail

          GOLDEN="19b84f3c458384f75a44cc394da8269e49e57340"
          V4_BASE="0c0f44a89aafe52195380bca0302faae58d13301"

          test "$(git rev-parse origin/golden/ui5k-oag-abo-gemi-ultra-gaming-v1)" = "${GOLDEN}"
          test "$(git merge-base "${V4_BASE}" HEAD)" = "${V4_BASE}"

          ACTUAL="$(git diff --name-only "${V4_BASE}" HEAD | sort)"
          EXPECTED="$(printf '%s\n' \
            '.github/workflows/oag-pubg-touch-v4-sticky-finger-recovery.yml' \
            '.github/workflows/oag-pubg-touch-v5-authoritative-snapshot.yml' \
            'oag/firmware/include/oag/firmware/mobile_touch_output.h' \
            'oag/firmware/src/mobile_touch_output.cpp' | sort)"

          echo "=== PUBG TOUCH V5 CHANGE SCOPE ==="
          printf '%s\n' "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

          # Gameplay mapping, coordinates, descriptors and unrelated runtime
          # paths must remain byte-identical to the hardware-tested V4 base.
          git diff --exit-code "${V4_BASE}" HEAD -- \
            oag/firmware/src/main.cpp \
            oag/include/oag/output/touch/mobile_touch_mapper.h \
            oag/src/output/touch/mobile_touch_mapper.cpp \
            oag/tests/host/test_mobile_touch_mapper.cpp \
            oag/firmware/src/usb_descriptors.cpp \
            oag/firmware/tusb_config.h \
            oag/firmware/src/mobile_touch_platform_driver.cpp \
            oag/firmware/src/multi_profile_platform_driver.cpp \
            oag/firmware/src/output_profile_selector.cpp \
            oag/firmware/src/usb_pio_host.cpp \
            oag/firmware/src/xinput_host.cpp \
            oag/firmware/src/bluetooth_host_v2.cpp \
            oag/src/protocol/hid/generic_hid_gamepad_driver.cpp

          python3 - <<'PY'
          from pathlib import Path

          h = Path('oag/firmware/include/oag/firmware/mobile_touch_output.h').read_text()
          cpp = Path('oag/firmware/src/mobile_touch_output.cpp').read_text()

          for token in [
              'kSnapshotPeriodUs = 4000',
              'kReleaseSnapshots = 8',
              'kPinnedContactCount = 3',
              'struct PhysicalSlot',
              'releaseSnapshotsRemaining',
              'static_assert(kMaxContacts == 10)',
          ]:
              assert token in h, token

          for token in [
              'report collection index == Contact Identifier',
              'out.flags = slot.active ? 0x03u : 0x00u;',
              'out.id = static_cast<std::uint8_t>(physicalId);',
              'report_.contactCount =',
              'commitAcceptedSnapshot();',
              'tud_hid_n_ready(0)',
              'tud_hid_n_report',
          ]:
              assert token in cpp, token

          for obsolete in [
              'ReleaseFence',
              'pendingReleaseMask_',
              'zeroSyncRemaining_',
          ]:
              assert obsolete not in h + cpp, obsolete

          print('PUBG_TOUCH_V5_GUARD=PASS')
          PY

      - name: Architecture dependency guard
        shell: bash
        run: |
          set -euo pipefail
          python3 oag/tools/check_architecture.py

      - name: Build and run all host tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S oag -B build/oag-host -DCMAKE_BUILD_TYPE=Release -DOAG_BUILD_HOST_TESTS=ON
          cmake --build build/oag-host --parallel 2
          ctest --test-dir build/oag-host --output-on-failure

  firmware:
    needs: guard-and-host-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.24.x"

      - name: Setup Pico SDK toolchain
        uses: Fortinbra/RaspberryPiPicoBuild@v7

      - name: Checkout exact Golden Pico SDK
        uses: actions/checkout@v4.1.1
        with:
          repository: raspberrypi/pico-sdk
          ref: 98a542c1a62fb549ffb5d66a3e5892b06276b670
          path: pico-sdk-ui5k
          submodules: recursive
          fetch-depth: 1

      - name: Verify pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pico-sdk-ui5k rev-parse HEAD)" = "98a542c1a62fb549ffb5d66a3e5892b06276b670"
          echo "PICO_SDK_PATH=${GITHUB_WORKSPACE}/pico-sdk-ui5k" >> "${GITHUB_ENV}"
          python3 oag/tools/prepare_dependencies.py

      - name: Build Pico 2 W candidate
        shell: bash
        run: |
          set -euo pipefail
          PICO_SDK_PATH="${GITHUB_WORKSPACE}/pico-sdk-ui5k" cmake -S oag/firmware -B build/oag-fw \
            -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=pico2_w -DPICO_PLATFORM=rp2350-arm-s
          cmake --build build/oag-fw --parallel 2

      - name: Package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          mapfile -t UF2 < <(find build/oag-fw -maxdepth 1 -type f -name '*.uf2' -print)
          mapfile -t ELF < <(find build/oag-fw -maxdepth 1 -type f -name '*.elf' -print)
          mapfile -t MAP < <(find build/oag-fw -maxdepth 1 -type f -name '*.map' -print)

          test "${#UF2[@]}" -eq 1
          test "${#ELF[@]}" -eq 1
          test "${#MAP[@]}" -eq 1

          SHORT_SHA="${GITHUB_SHA::8}"
          cp "${UF2[0]}" "artifacts/OAG_PUBG_TOUCH_V5_${SHORT_SHA}_Pico2W.uf2"
          cp "${ELF[0]}" "artifacts/OAG_PUBG_TOUCH_V5_${SHORT_SHA}_Pico2W.elf"
          cp "${MAP[0]}" "artifacts/OAG_PUBG_TOUCH_V5_${SHORT_SHA}_Pico2W.map"
          sha256sum artifacts/OAG_PUBG_TOUCH_V5_* > artifacts/SHA256SUMS.txt

          cat > artifacts/BUILD-INFO.txt <<'INFO'
          GOLDEN_BASE=19b84f3c458384f75a44cc394da8269e49e57340
          V4_BASE=0c0f44a89aafe52195380bca0302faae58d13301
          PROFILE_7=PUBG_TOUCH_V5_AUTHORITATIVE_SNAPSHOT_RECOVERY
          HOTKEY_TOUCH=F8+F9+7_HOLD_1.5_SECONDS
          TOUCH_VID_PID=CAFE:4018
          SCREENSHOT=1910x864
          ANDROID_NATURAL_TOUCH_SPACE=1080x2388
          SNAPSHOT_PERIOD=4MS_250HZ
          TOUCH_REPORT=10_FIXED_CONTACT_RECORDS_EVERY_ACCEPTED_REPORT
          REPORT_COLLECTION_INDEX=PHYSICAL_CONTACT_ID
          PINNED_IDS=0_CAMERA,1_MOVEMENT,2_FIRE
          FIRE=POINTER_556_2292_HID_16869_31451_FIXED
          AIM_FIRE=SEPARATE_PINNED_CONTACTS
          RELEASE_BARRIER=8_ACCEPTED_AUTHORITATIVE_SNAPSHOTS
          RELEASE_BARRIER_ADVANCE=ONLY_AFTER_TINYUSB_ACCEPTS_REPORT
          USB_BACKPRESSURE=CANNOT_EXPIRE_RELEASE
          ID_REUSE=BLOCKED_UNTIL_RELEASE_BARRIER_COMPLETE
          INACTIVE_CONTACTS=EXPLICIT_TIP0_INRANGE0
          GAMEPLAY_MAPPING=BYTE_IDENTICAL_TO_V4_BASE
          SHIFT=POINTER_860_1925
          RIGHT_CLICK=POINTER_525_2230
          R=POINTER_77_1850
          SCROLL_DOWN=POINTER_100_1050
          SCROLL_UP=POINTER_100_1305
          MIDDLE_CLICK=POINTER_82_1575
          F=POINTER_680_1630
          G=POINTER_90_800
          PUBGMOUSE_LOOK_BOX_X=303..778
          PUBGMOUSE_LOOK_BOX_Y=934..1454
          INFO

      - name: Upload candidate
        uses: actions/upload-artifact@v4.3.1
        with:
          name: OAG-PUBG-TOUCH-V5
          path: artifacts/*
          if-no-files-found: error
